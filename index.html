<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070b14">
    <title>专注飞行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #070b14;
            --acrylic: rgba(18, 24, 40, 0.72);
            --accent: #60a5fa;
            --accent2: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --nav-h: 56px;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
            --border: rgba(255,255,255,0.08);
            --border2: rgba(255,255,255,0.14);
            --gold: #fbbf24;
            --nav-total: calc(var(--nav-h) + var(--safe-b));
            --touch-min: 44px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{
            width:100%;height:100dvh;height:100vh;overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg);color:var(--text);
            user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
            touch-action:manipulation;position:fixed;top:0;left:0;right:0;bottom:0;
        }
        #app{width:100%;height:100%;display:flex;flex-direction:column;position:relative;}
        #canvasContainer{flex:1;width:100%;position:relative;overflow:hidden;background:#060b18;}
        #mapCanvas{width:100%;height:100%;display:block;touch-action:none;}
        #resetViewBtn{
            position:fixed;bottom:calc(var(--nav-total) + 18px);right:14px;z-index:15;
            width:46px;height:46px;border-radius:50%;background:var(--acrylic);
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
            border:1px solid var(--border2);color:#fff;font-size:22px;
            display:flex;align-items:center;justify-content:center;cursor:pointer;
            box-shadow:0 4px 18px rgba(0,0,0,.4);transition:all .2s;
        }
        #resetViewBtn:active{transform:scale(.85);background:rgba(96,165,250,.22);border-color:var(--accent);}
        #bottomNav{
            position:fixed;bottom:0;left:0;right:0;z-index:30;height:var(--nav-total);
            padding-bottom:var(--safe-b);background:var(--acrylic);
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            display:flex;border-top:1px solid var(--border);
        }
        #bottomNav button{
            flex:1;border:none;background:transparent;color:var(--text2);font-size:11px;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:3px;cursor:pointer;transition:all .2s;min-height:44px;
        }
        #bottomNav button.active{color:var(--accent);}
        #bottomNav button i{font-size:17px;}
        .overlay{
            position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
            animation:fadeIn .2s ease;
        }
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .panel{
            background:var(--acrylic);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border-radius:22px;padding:22px 18px;width:88%;max-width:360px;
            border:1px solid var(--border2);animation:popIn .3s cubic-bezier(.16,1,.3,1);
            box-shadow:0 12px 48px rgba(0,0,0,.55);max-height:80vh;overflow-y:auto;
        }
        .panel h2{font-size:19px;margin-bottom:6px;text-align:center;color:#fff;font-weight:700;}
        .panel .subtitle{font-size:13px;color:var(--text2);text-align:center;margin-bottom:14px;line-height:1.4;}
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:6px;
            padding:12px 20px;border-radius:14px;border:none;font-size:14px;font-weight:600;
            cursor:pointer;transition:all .2s;min-height:var(--touch-min);
        }
        .btn-primary{
            background:linear-gradient(135deg,#3b82f6,#60a5fa);color:#fff;width:100%;
            box-shadow:0 4px 14px rgba(59,130,246,.3);
        }
        .btn-primary:active{transform:scale(.96);}
        .btn-danger{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.5);color:#ef4444;}
        .btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--text);}
        .btn-sm{padding:9px 15px;font-size:12px;border-radius:11px;min-height:38px;}
        .duration-options{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0;}
        .duration-opt{
            flex:1;min-width:46px;padding:13px 6px;border-radius:13px;
            border:1.5px solid var(--border2);background:rgba(255,255,255,.03);
            color:var(--text);text-align:center;cursor:pointer;font-size:13px;
            font-weight:600;transition:all .2s;min-height:var(--touch-min);
        }
        .duration-opt.selected{
            border-color:var(--accent);background:rgba(96,165,250,.15);
            color:var(--accent);box-shadow:0 0 14px rgba(96,165,250,.18);
        }

        /* 机票 */
        #ticketOverlay{
            position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
            background:rgba(0,0,0,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
        }
        .ticket-card{
            width:90%;max-width:340px;background:linear-gradient(150deg,#141d30,#1a1f35,#141827);
            border-radius:18px;border:1.5px solid rgba(255,255,255,.12);
            box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;position:relative;
        }
        .ticket-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,#22c55e,#60a5fa,#a78bfa,#f59e0b);z-index:2;
        }
        .ticket-top{padding:18px 14px 10px;position:relative;z-index:3;}
        .ticket-header{text-align:center;margin-bottom:8px;}
        .ticket-header .flight-no{font-size:24px;font-weight:900;letter-spacing:4px;color:var(--accent);}
        .ticket-route{
            display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;
            padding:8px;background:rgba(255,255,255,.03);border-radius:10px;
            font-size:13px;font-weight:600;color:#fff;text-align:center;flex-wrap:wrap;
        }
        .ticket-route .arrow{color:var(--accent2);font-size:16px;}
        .ticket-info{font-size:11px;color:var(--text2);line-height:1.7;text-align:center;}
        .ticket-info span{color:#fff;font-weight:600;}
        .ticket-dashed-sep{position:relative;border-top:2px dashed rgba(255,255,255,.22);margin:0 14px;}
        .ticket-dashed-sep::before,.ticket-dashed-sep::after{
            content:'';position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;
            background:#070b14;border:2px solid rgba(255,255,255,.14);z-index:4;
        }
        .ticket-dashed-sep::before{left:-24px;}.ticket-dashed-sep::after{right:-24px;}
        .ticket-tear-area{padding:12px 14px 16px;text-align:center;position:relative;z-index:3;}
        .ticket-tear-hint{font-size:14px;color:var(--accent2);animation:pulseAnim 1.5s ease-in-out infinite;margin-bottom:8px;}
        @keyframes pulseAnim{0%,100%{opacity:.65}50%{opacity:1}}
        .ticket-tear-bar{
            height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;
            position:relative;cursor:pointer;touch-action:pan-x;
        }
        .ticket-tear-fill{
            height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444);
            border-radius:4px;width:0%;transition:width .04s linear;will-change:width;
        }
        .ticket-tear-label{font-size:11px;color:var(--text2);margin-top:4px;}

        /* 飞行状态栏 */
        #flightBar{
            position:fixed;top:max(10px,var(--safe-t,10px));left:50%;transform:translateX(-50%);
            z-index:35;background:var(--acrylic);backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);border-radius:20px;padding:8px 16px;
            border:1px solid var(--border2);box-shadow:0 8px 24px rgba(0,0,0,.5);
            font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;
        }
        #flightBar .flight-row{display:flex;align-items:center;gap:10px;}
        #flightBar .timer{
            font-size:21px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
            font-family:'SF Mono','Menlo','Consolas',monospace;min-width:54px;text-align:center;
        }
        #flightBar .dist{color:var(--accent2);font-size:12px;min-width:72px;text-align:right;font-variant-numeric:tabular-nums;}
        #flightBar .route-label{font-size:11px;color:var(--text2);letter-spacing:.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
        #flightBar button{
            padding:5px 11px;border-radius:9px;border:1px solid rgba(239,68,68,.45);
            background:rgba(239,68,68,.1);color:#ef4444;font-size:11px;cursor:pointer;min-height:32px;
        }

        /* 机场简介气泡 */
        .airport-lore-popup{
            position:fixed;z-index:26;background:var(--acrylic);backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:14px;
            padding:10px 14px;font-size:11px;color:var(--text);max-width:220px;
            box-shadow:0 6px 24px rgba(0,0,0,.5);animation:popIn .25s ease;line-height:1.5;
        }
        .airport-lore-popup .lore-name{font-weight:700;color:var(--accent2);margin-bottom:3px;font-size:12px;}

        /* 页面 */
        .page{
            position:fixed;inset:0;bottom:var(--nav-total);z-index:20;
            background:rgba(7,11,20,.94);backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);display:none;flex-direction:column;overflow:hidden;padding:0;
        }
        .page.active{display:flex;}
        .page-hdr{
            flex-shrink:0;padding:16px 14px 10px;text-align:center;background:var(--acrylic);
            backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border);z-index:2;
        }
        .page-hdr h2{font-size:20px;color:#fff;font-weight:700;letter-spacing:1px;margin:0;}
        .page-list{flex:1;overflow-y:auto;padding:10px 14px 20px;-webkit-overflow-scrolling:touch;}
        .record-item{
            background:rgba(20,26,42,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
            border-radius:13px;padding:12px 14px;margin-bottom:7px;border:1px solid var(--border);
            display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px;
        }
        .record-item .route{font-weight:600;color:#fff;font-size:13px;}
        .record-item .meta{color:var(--text2);font-size:10px;}
        .record-item .km{color:var(--accent2);font-weight:700;font-size:14px;flex-shrink:0;}
        .achievement-item{
            background:rgba(20,26,42,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
            border-radius:13px;padding:12px 14px;margin-bottom:7px;border:1px solid var(--border);
            display:flex;align-items:center;gap:10px;
        }
        .achievement-item.unlocked{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.06);}
        .achievement-item.locked{opacity:.42;}
        .achievement-item .ach-icon{font-size:26px;flex-shrink:0;}
        .achievement-item .ach-info{flex:1;min-width:0;}
        .achievement-item .ach-name{font-weight:700;color:#fff;font-size:13px;}
        .achievement-item .ach-req{font-size:10px;color:var(--text2);}
        .page-actions{display:flex;gap:8px;padding:8px 14px 14px;justify-content:center;flex-wrap:wrap;flex-shrink:0;}
        .airport-tooltip{
            position:fixed;z-index:25;background:var(--acrylic);backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:11px;
            padding:7px 12px;font-size:11px;pointer-events:none;white-space:nowrap;
            box-shadow:0 4px 14px rgba(0,0,0,.45);opacity:0;transition:opacity .15s;
        }
        .airport-tooltip.visible{opacity:1;}
        #selectionHint{
            position:fixed;bottom:calc(var(--nav-total) + 12px);left:50%;transform:translateX(-50%);
            z-index:25;background:var(--acrylic);backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:18px;
            padding:9px 18px;font-size:11px;color:var(--text2);white-space:nowrap;
            text-align:center;pointer-events:none;transition:opacity .3s;max-width:90vw;
        }
        @keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% + 6px))}40%{transform:translateX(calc(-50% - 6px))}60%{transform:translateX(calc(-50% + 4px))}80%{transform:translateX(calc(-50% - 4px))}}
        .shake{animation:shake .5s ease;}
        .hidden{display:none!important;}
        .text-center{text-align:center;}
        .mt-8{margin-top:8px;}
        .mt-12{margin-top:12px;}
        .confetti{
            position:fixed;z-index:80;pointer-events:none;
            animation:confettiFall linear forwards;font-size:20px;
        }
        @keyframes confettiFall{0%{transform:translateY(-100px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
        .achievement-popup{
            background:var(--acrylic);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border:2px solid var(--gold);border-radius:22px;padding:22px 18px;text-align:center;
            animation:popIn .4s cubic-bezier(.16,1,.3,1);box-shadow:0 0 42px rgba(251,191,36,.25);
            width:85%;max-width:320px;
        }
        .achievement-popup .icon{font-size:44px;margin-bottom:6px;}
        .achievement-popup .name{font-size:19px;font-weight:700;color:var(--gold);}
        .achievement-popup .desc{font-size:12px;color:var(--text2);margin-top:4px;}
    </style>
</head>
<body>
    <div id="app">
        <div id="canvasContainer"><canvas id="mapCanvas"></canvas></div>
        <button id="resetViewBtn" aria-label="复位视角">♻️</button>
        <div id="flightBar" class="hidden">
            <div class="flight-row">
                <span class="timer" id="flightTimer">00:00</span>
                <span class="dist" id="flightDist">0.000 km</span>
                <button id="cancelFlightBtn">取消</button>
            </div>
            <span class="route-label" id="flightRouteLabel"></span>
        </div>
        <div id="selectionHint">👆 点击机场选择起点</div>
        <div class="airport-tooltip" id="airportTooltip"></div>

        <div class="page" id="recordsPage">
            <div class="page-hdr"><h2>📋 飞行记录</h2></div>
            <div class="page-list" id="recordsList"></div>
            <div class="page-actions">
                <button class="btn btn-sm btn-ghost" id="exportBtn"><i class="fa-solid fa-download"></i> 导出</button>
                <button class="btn btn-sm btn-ghost" id="importBtn"><i class="fa-solid fa-upload"></i> 导入</button>
            </div>
            <input type="file" id="importFileInput" accept=".json" class="hidden">
        </div>

        <div class="page" id="achievementsPage">
            <div class="page-hdr"><h2>🏆 成就</h2></div>
            <div class="page-list" id="achievementsList"></div>
        </div>

        <nav id="bottomNav">
            <button class="active" data-view="map"><i class="fa-solid fa-map"></i>地图</button>
            <button data-view="records"><i class="fa-solid fa-list"></i>记录</button>
            <button data-view="achievements"><i class="fa-solid fa-trophy"></i>成就</button>
        </nav>
    </div>

    <script>
        (function() {
            // ═══════════════════ 配置 ═══════════════════
            const MAP_W = 6000,
                MAP_H = 4500,
                CELL_SIZE = 40;
            const UNITS_PER_KM = 8;
            const MIN_AIRPORT_DIST = 380;
            const AIRPORT_COUNT = 22;
            const ZOOM_LERP_SPEED = 0.12;
            const MIN_ZOOM = 0.18,
                MAX_ZOOM = 4.5;
            const RESET_LERP_SPEED = 0.09;
            const CLICK_MOVE_THRESHOLD = 8;
            const PLANE_BODY_RX = 10,
                PLANE_BODY_RY = 4.5,
                PLANE_SCALE_BASE = 0.75;

            const AIRPORT_NAMES = [
                '星辰彼岸空港', '深渊回响基地', '苍穹断章机场', '极光幻境空港', '虚空之门机场',
                '时光裂隙基地', '雷霆之翼空港', '暮光序章机场', '银河渡口基地', '风暴之眼空港',
                '黎明挽歌机场', '幻梦浮岛基地', '暗影苍穹空港', '永恒回廊机场', '极星天枢基地',
                '落日余烬空港', '冰霜王座机场', '星辉彼岸基地', '月辉圣殿空港', '破晓征途机场',
                '幽蓝深谷空港', '炽焰要塞基地', '潮汐圣殿机场', '虚空回响空港', '极夜灯塔机场'
            ];

            const LORE_POOL = [
                '悬浮于永夜裂隙之上，唯有星辰指引航向。',
                '深埋于地壳回响之中，每次起飞都是对深渊的告别。',
                '断章残篇散落云端，拼凑出失落文明的航图。',
                '极光织就跑道，幻境与现实在此交错。',
                '门扉矗立于虚空，穿越者方见其真容。',
                '时间于此处凝结成晶，每一次降落都跨越了纪元。',
                '雷暴永不停歇，唯有勇者之翼能穿越风暴。',
                '序章写在暮色里，每一架航班都是未完的故事。',
                '银河在此转弯，渡口连接着万千星域。',
                '暴风眼中唯一的宁静之地，航行者最后的庇护所。',
                '挽歌回荡在黎明天际，纪念那些未曾抵达的旅人。',
                '浮岛游离于梦境边缘，降落即是苏醒。',
                '暗影遮蔽苍穹，唯有最亮的灯塔能穿透迷雾。',
                '回廊无尽循环，每一次起飞都是新的起点。',
                '天枢之位定极星，四方航路由此展开。',
                '余烬中升起的新星，文明之火永不熄灭。',
                '冰封王座俯瞰大地，霜雪铸就的飞行堡垒。',
                '彼岸之花在星辉中绽放，归航者终将抵达。',
                '圣殿沐浴月华，朝圣者跨越星空而来。',
                '破晓时分踏上征途，追逐永不落幕的黎明。',
                '深谷幽蓝如海，飞行器如游鱼穿梭其间。',
                '炽焰永不熄灭，熔岩铸就的钢铁要塞。',
                '潮汐随月相涨落，唯有圣殿永驻浪尖。',
                '虚空中的回响不绝，每一次降落都是重逢。',
                '极夜笼罩灯塔，光芒穿透万年长夜。'
            ];

            const DIST_ACHIEVEMENTS = [
                { threshold: 100, name: '云中漫步', icon: '☁️', desc: '累计飞行100公里', type: 'dist' },
                { threshold: 500, name: '苍穹旅人', icon: '🌤️', desc: '累计飞行500公里', type: 'dist' },
                { threshold: 2000, name: '次元穿越者', icon: '🌌', desc: '累计飞行2000公里', type: 'dist' },
                { threshold: 10000, name: '星海归航', icon: '🌟', desc: '累计飞行10000公里', type: 'dist' },
            ];
            const TIME_ACHIEVEMENTS = [
                { threshold: 300, name: '时光旅人', icon: '⏳', desc: '累计专注300分钟', type: 'time' },
                { threshold: 1000, name: '专注圣者', icon: '🧘', desc: '累计专注1000分钟', type: 'time' },
                { threshold: 5000, name: '永恒守望者', icon: '🔮', desc: '累计专注5000分钟', type: 'time' },
                { threshold: 15000, name: '时空主宰', icon: '👑', desc: '累计专注15000分钟', type: 'time' },
            ];
            const ALL_ACHIEVEMENTS = [...DIST_ACHIEVEMENTS, ...TIME_ACHIEVEMENTS];

            const TERRAIN_TYPES = [
                { name: 'deep_water', color: '#1a3a5c', weight: 12 },
                { name: 'water', color: '#2a5f8a', weight: 10 },
                { name: 'plains', color: '#5a8c3e', weight: 18 },
                { name: 'light_plains', color: '#7aaa4a', weight: 10 },
                { name: 'forest', color: '#3d6b2e', weight: 14 },
                { name: 'mountain', color: '#7a6b5c', weight: 12 },
                { name: 'high_mountain', color: '#9e8e7e', weight: 8 },
                { name: 'snow', color: '#d8dce6', weight: 6 },
                { name: 'desert', color: '#c4a855', weight: 6 },
                { name: 'red_rock', color: '#b85a3a', weight: 4 },
            ];

            function calcDistanceKm(from, to) {
                return Math.sqrt((to.x - from.x) ** 2 + (to.y - from.y) ** 2) / UNITS_PER_KM;
            }

            // ═══════════════════ 状态 ═══════════════════
            const state = {
                terrainGrid: [],
                airports: [],
                rivers: [],
                clouds: [],
                departureAirport: null,
                destinationAirport: null,
                flight: null,
                isFlying: false,
                viewX: MAP_W / 2,
                viewY: MAP_H / 2,
                viewZoom: 1,
                defaultZoom: 1,
                targetZoom: 1,
                pinchStartDist: 0,
                pinchStartZoom: 1,
                pinchCenterX: 0,
                pinchCenterY: 0,
                isPinching: false,
                panStart: null,
                pointerDownPos: { x: 0, y: 0 },
                pointerMoved: false,
                pendingClickAirport: null,
                isResetting: false,
                resetTargetX: MAP_W / 2,
                resetTargetY: MAP_H / 2,
                totalKm: 0,
                totalFocusMin: 0,
                history: [],
                unlockedAchievements: [],
                currentView: 'map',
                wakeLock: null,
                tooltipAirport: null,
                lorePopup: null,
                loreAirport: null,
                animationId: null,
                baseDisplayW: 0,
                baseDisplayH: 0,
                lastAirportClickTime: 0,
            };

            // ═══════════════════ DOM ═══════════════════
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            const canvasContainer = document.getElementById('canvasContainer');
            const flightBar = document.getElementById('flightBar');
            const flightTimer = document.getElementById('flightTimer');
            const flightDist = document.getElementById('flightDist');
            const flightRouteLabel = document.getElementById('flightRouteLabel');
            const cancelFlightBtn = document.getElementById('cancelFlightBtn');
            const selectionHint = document.getElementById('selectionHint');
            const airportTooltip = document.getElementById('airportTooltip');
            const recordsPage = document.getElementById('recordsPage');
            const achievementsPage = document.getElementById('achievementsPage');
            const recordsList = document.getElementById('recordsList');
            const achievementsList = document.getElementById('achievementsList');
            const navButtons = document.querySelectorAll('#bottomNav button');
            const importFileInput = document.getElementById('importFileInput');
            const resetViewBtn = document.getElementById('resetViewBtn');

            function saveData() {
                try { localStorage.setItem('ff_v2', JSON.stringify({ totalKm: state.totalKm,
                        totalFocusMin: state.totalFocusMin, history: state.history,
                        unlockedAchievements: state.unlockedAchievements })); } catch (e) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem('ff_v2');
                    if (raw) { const d = JSON.parse(raw);
                        state.totalKm = d.totalKm || 0;
                        state.totalFocusMin = d.totalFocusMin || 0;
                        state.history = d.history || [];
                        state.unlockedAchievements = d.unlockedAchievements || []; }
                } catch (e) {}
            }

            // ═══════════════════ 地形 ═══════════════════
            function generateTerrainAndRivers() {
                const seeds = [];
                const tw = TERRAIN_TYPES.reduce((s, t) => s + t.weight, 0);
                for (let i = 0; i < 55; i++) {
                    let r = Math.random() * tw,
                        acc = 0,
                        ti = 0;
                    for (let j = 0; j < TERRAIN_TYPES.length; j++) { acc += TERRAIN_TYPES[j].weight; if (r <= acc) { ti =
                                j; break; } }
                    seeds.push({ x: Math.random() * MAP_W, y: Math.random() * MAP_H, type: ti });
                }
                const grid = [];
                for (let row = 0; row < MAP_H / CELL_SIZE; row++) {
                    grid[row] = new Uint8Array(MAP_W / CELL_SIZE);
                    for (let col = 0; col < MAP_W / CELL_SIZE; col++) {
                        const cx = (col + 0.5) * CELL_SIZE,
                            cy = (row + 0.5) * CELL_SIZE;
                        let md = Infinity,
                            bt = 0;
                        for (const s of seeds) { const d = (cx - s.x) ** 2 + (cy - s.y) ** 2; if (d < md) { md = d;
                                bt = s.type; } }
                        grid[row][col] = bt;
                    }
                }
                state.terrainGrid = grid;
                const rivers = [];
                for (let i = 0; i < 12; i++) {
                    const pts = [];
                    let sx = Math.random() * MAP_W,
                        sy = Math.random() * MAP_H * 0.5 + MAP_H * 0.2;
                    const len = 8 + Math.floor(Math.random() * 20);
                    for (let j = 0; j < len; j++) { pts.push({ x: sx, y: sy });
                        sx += (Math.random() - 0.35) * 140;
                        sy += Math.random() * 90 + 40; if (sx < 0 || sx > MAP_W || sy > MAP_H) break; }
                    if (pts.length >= 5) rivers.push(pts);
                }
                state.rivers = rivers;
                const clouds = [];
                for (let i = 0; i < 35; i++) clouds.push({ x: Math.random() * MAP_W, y: Math.random() * MAP_H, r: 60 + Math
                        .random() * 130, alpha: 0.04 + Math.random() * 0.07 });
                state.clouds = clouds;
            }

            function placeAirports() {
                const names = [...AIRPORT_NAMES];
                for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));
                    [names[i], names[j]] = [names[j], names[i]]; }
                const loreCopy = [...LORE_POOL];
                for (let i = loreCopy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));
                    [loreCopy[i], loreCopy[j]] = [loreCopy[j], loreCopy[i]]; }
                const sel = names.slice(0, AIRPORT_COUNT);
                const airports = [];
                for (let k = 0; k < sel.length; k++) {
                    const name = sel[k],
                        lore = loreCopy[k % loreCopy.length];
                    let placed = false;
                    for (let a = 0; a < 5000; a++) {
                        const x = 150 + Math.random() * (MAP_W - 300),
                            y = 150 + Math.random() * (MAP_H - 300);
                        const c = Math.floor(x / CELL_SIZE),
                            r = Math.floor(y / CELL_SIZE);
                        if (state.terrainGrid[r] && state.terrainGrid[r][c] === 0) continue;
                        let tc = false;
                        for (const ap of airports) { if ((x - ap.x) ** 2 + (y - ap.y) ** 2 < MIN_AIRPORT_DIST ** 2) { tc =
                                    true; break; } }
                        if (!tc) { airports.push({ x, y, name, lore, id: 'ap_' + airports.length });
                            placed = true; break; }
                    }
                    if (!placed) airports.push({ x: 200 + Math.random() * (MAP_W - 400), y: 200 + Math.random() * (
                            MAP_H - 400), name, lore, id: 'ap_' + airports.length });
                }
                state.airports = airports;
            }

            function resizeCanvas() {
                const rect = canvasContainer.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                state.baseDisplayW = rect.width;
                state.baseDisplayH = rect.height;
                state.defaultZoom = Math.min(rect.width / MAP_W, rect.height / MAP_H) * 0.92;
                if (!state.isResetting) { state.viewZoom = state.defaultZoom;
                    state.targetZoom = state.defaultZoom; }
            }

            function worldToScreen(wx, wy) {
                return { x: (wx - state.viewX) * state.viewZoom + state.baseDisplayW / 2, y: (wy - state.viewY) * state
                        .viewZoom + state.baseDisplayH / 2 };
            }

            function screenToWorld(sx, sy) {
                return { x: (sx - state.baseDisplayW / 2) / state.viewZoom + state.viewX, y: (sy - state.baseDisplayH / 2) /
                        state.viewZoom + state.viewY };
            }

            function clampViewport() {
                const hw = (state.baseDisplayW / 2) / state.viewZoom,
                    hh = (state.baseDisplayH / 2) / state.viewZoom;
                state.viewX = Math.max(hw - 50, Math.min(MAP_W + 50 - hw, state.viewX));
                state.viewY = Math.max(hh - 50, Math.min(MAP_H + 50 - hh, state.viewY));
            }

            function clampZoom(z) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }

            function hitTestAirport(sx, sy) {
                const w = screenToWorld(sx, sy);
                const hr = 30 / state.viewZoom;
                let best = null,
                    bd = Infinity;
                for (const ap of state.airports) { const d = Math.sqrt((w.x - ap.x) ** 2 + (w.y - ap.y) ** 2); if (d < hr &&
                        d < bd) { best = ap;
                        bd = d; } }
                return best;
            }

            // ═══════════════════ 绘制 ═══════════════════
            function drawMap() {
                const dw = state.baseDisplayW,
                    dh = state.baseDisplayH;
                ctx.clearRect(0, 0, dw, dh);
                const hw = dw / 2 / state.viewZoom,
                    hh = dh / 2 / state.viewZoom;
                const minCol = Math.max(0, Math.floor((state.viewX - hw) / CELL_SIZE) - 1);
                const maxCol = Math.min(Math.floor(MAP_W / CELL_SIZE) - 1, Math.ceil((state.viewX + hw) / CELL_SIZE) + 1);
                const minRow = Math.max(0, Math.floor((state.viewY - hh) / CELL_SIZE) - 1);
                const maxRow = Math.min(Math.floor(MAP_H / CELL_SIZE) - 1, Math.ceil((state.viewY + hh) / CELL_SIZE) + 1);

                for (let r = minRow; r <= maxRow; r++) {
                    const gridRow = state.terrainGrid[r];
                    if (!gridRow) continue;
                    for (let c = minCol; c <= maxCol; c++) {
                        const sp = worldToScreen(c * CELL_SIZE, r * CELL_SIZE);
                        const cs = Math.ceil(CELL_SIZE * state.viewZoom) + 1;
                        const ti = gridRow[c] !== undefined ? gridRow[c] : 0;
                        const bc = TERRAIN_TYPES[ti].color;
                        const v = ((Math.sin(r * 7.99 + c * 13.37) * 1e4) % 1) * 7 - 3.5;
                        ctx.fillStyle = 'rgb(' + Math.max(0, Math.min(255, parseInt(bc.slice(1, 3), 16) + (v | 0))) +
                            ',' + Math.max(0, Math.min(255, parseInt(bc.slice(3, 5), 16) + (v | 0))) + ',' + Math.max(0,
                                Math.min(255, parseInt(bc.slice(5, 7), 16) + (v | 0))) + ')';
                        ctx.fillRect(sp.x, sp.y, cs, cs);
                    }
                }
                for (const river of state.rivers) {
                    if (river.length < 2) continue;
                    let anyVisible = false;
                    for (const pt of river) { const sp = worldToScreen(pt.x, pt.y); if (sp.x > -100 && sp.x < dw + 100 && sp
                            .y > -100 && sp.y < dh + 100) { anyVisible = true; break; } }
                    if (!anyVisible) continue;
                    ctx.beginPath();
                    const sp0 = worldToScreen(river[0].x, river[0].y);
                    ctx.moveTo(sp0.x, sp0.y);
                    for (let i = 1; i < river.length; i++) { const sp = worldToScreen(river[i].x, river[i].y);
                        ctx.lineTo(sp.x, sp.y); }
                    ctx.strokeStyle = 'rgba(100,160,210,0.32)';
                    ctx.lineWidth = Math.max(1.3, 3.2 * state.viewZoom);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(160,210,245,0.18)';
                    ctx.lineWidth = Math.max(0.7, 1.3 * state.viewZoom);
                    ctx.stroke();
                }
                for (const cl of state.clouds) {
                    const sp = worldToScreen(cl.x, cl.y);
                    if (sp.x < -180 || sp.x > dw + 180 || sp.y < -180 || sp.y > dh + 180) continue;
                    const r = cl.r * state.viewZoom;
                    ctx.fillStyle = 'rgba(255,255,255,' + cl.alpha + ')';
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sp.x - r * 0.5, sp.y - r * 0.12, r * 0.62, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sp.x + r * 0.42, sp.y - r * 0.08, r * 0.52, 0, Math.PI * 2);
                    ctx.fill();
                }
                if (!state.isFlying && state.departureAirport && state.destinationAirport) {
                    const fs = worldToScreen(state.departureAirport.x, state.departureAirport.y);
                    const ts = worldToScreen(state.destinationAirport.x, state.destinationAirport.y);
                    ctx.setLineDash([6, 8]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(fs.x, fs.y);
                    ctx.lineTo(ts.x, ts.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                for (const ap of state.airports) {
                    const sp = worldToScreen(ap.x, ap.y);
                    if (sp.x < -60 || sp.x > dw + 60 || sp.y < -60 || sp.y > dh + 60) continue;
                    const isDep = state.departureAirport && state.departureAirport.id === ap.id;
                    const isDest = state.destinationAirport && state.destinationAirport.id === ap.id;
                    const isFF = state.isFlying && state.flight && state.flight.from.id === ap.id;
                    const isFT = state.isFlying && state.flight && state.flight.to.id === ap.id;
                    const hl = isDep || isDest || isFF || isFT;
                    let gc, rc, dc;
                    if (isDep) { gc = 'rgba(34,197,94,0.5)';
                        rc = 'rgba(34,197,94,0.7)';
                        dc = '#22c55e'; } else if (isDest) { gc = 'rgba(239,68,68,0.5)';
                        rc = 'rgba(239,68,68,0.7)';
                        dc = '#ef4444'; } else if (isFF) { gc = 'rgba(96,165,250,0.45)';
                        rc = 'rgba(96,165,250,0.6)';
                        dc = '#60a5fa'; } else if (isFT) { gc = 'rgba(245,158,11,0.45)';
                        rc = 'rgba(245,158,11,0.6)';
                        dc = '#f59e0b'; } else { dc = '#e2e8f0'; }
                    if (hl) { ctx.beginPath();
                        ctx.arc(sp.x, sp.y, 17, 0, Math.PI * 2);
                        ctx.fillStyle = gc;
                        ctx.fill(); const pulse = Math.sin(Date.now() / 350) * 0.3 + 0.7;
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, 22 * pulse, 0, Math.PI * 2);
                        ctx.strokeStyle = rc;
                        ctx.lineWidth = 2.2;
                        ctx.stroke(); }
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = dc;
                    ctx.fill();
                    ctx.strokeStyle = '#060b18';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                    const fs = Math.max(9, Math.min(13, 11 * state.viewZoom * 1.4));
                    ctx.fillStyle = '#fff';
                    ctx.font = '600 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ap.name, sp.x, sp.y - 15);
                }
                if (state.isFlying && state.flight) {
                    const fromSp = worldToScreen(state.flight.from.x, state.flight.from.y);
                    const toSp = worldToScreen(state.flight.to.x, state.flight.to.y);
                    ctx.setLineDash([6, 5]);
                    ctx.strokeStyle = 'rgba(245,158,11,0.48)';
                    ctx.lineWidth = 2.3;
                    ctx.beginPath();
                    ctx.moveTo(fromSp.x, fromSp.y);
                    ctx.lineTo(toSp.x, toSp.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const tt = state.flight.durationMin * 60;
                    const prog = Math.min(1, Math.max(0, el / tt));
                    const dirX = state.flight.to.x - state.flight.from.x;
                    const dirY = state.flight.to.y - state.flight.from.y;
                    const psp = worldToScreen(state.flight.from.x + dirX * prog, state.flight.from.y + dirY * prog);
                    const angle = Math.atan2(dirY, dirX);
                    for (let t = 0; t < 5; t++) {
                        const tp = Math.max(0, prog - (t + 1) * 0.004);
                        const tsp = worldToScreen(state.flight.from.x + dirX * tp, state.flight.from.y + dirY * tp);
                        ctx.beginPath();
                        ctx.arc(tsp.x, tsp.y, Math.max(0.6, 3 - t * 0.5), 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0.03, 0.34 - t * 0.06) + ')';
                        ctx.fill();
                    }
                    ctx.save();
                    ctx.translate(psp.x, psp.y);
                    ctx.rotate(angle);
                    const sc = PLANE_SCALE_BASE / Math.max(0.45, state.viewZoom);
                    ctx.scale(sc, sc);
                    ctx.shadowColor = 'rgba(0,0,0,0.32)';
                    ctx.shadowBlur = 3;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, PLANE_BODY_RX, PLANE_BODY_RY, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.moveTo(PLANE_BODY_RX, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.48, -PLANE_BODY_RY * 0.85);
                    ctx.lineTo(PLANE_BODY_RX * 0.48, PLANE_BODY_RY * 0.85);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#93c5fd';
                    ctx.beginPath();
                    ctx.arc(PLANE_BODY_RX * 0.33, 0, PLANE_BODY_RY * 0.48, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.1, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.14, -PLANE_BODY_RY * 2);
                    ctx.lineTo(PLANE_BODY_RX * 0.38, -PLANE_BODY_RY * 2);
                    ctx.lineTo(0, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.1, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.14, PLANE_BODY_RY * 2);
                    ctx.lineTo(PLANE_BODY_RX * 0.38, PLANE_BODY_RY * 2);
                    ctx.lineTo(0, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.68, 0);
                    ctx.lineTo(-PLANE_BODY_RX * 0.28, -PLANE_BODY_RY * 1.2);
                    ctx.lineTo(-PLANE_BODY_RX * 0.1, -PLANE_BODY_RY * 1.2);
                    ctx.lineTo(-PLANE_BODY_RX * 0.42, 0);
                    ctx.closePath();
                    ctx.fill();
                    const pa = Date.now() / 48;
                    ctx.fillStyle = '#64748b';
                    ctx.save();
                    ctx.translate(PLANE_BODY_RX, 0);
                    ctx.rotate(pa);
                    ctx.fillRect(-0.9, -PLANE_BODY_RY * 0.8, 1.8, PLANE_BODY_RY * 1.6);
                    ctx.fillRect(-PLANE_BODY_RY * 0.8, -0.9, PLANE_BODY_RY * 1.6, 1.8);
                    ctx.restore();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            function gameLoop() {
                const zd = state.targetZoom - state.viewZoom;
                if (Math.abs(zd) < 0.0004) state.viewZoom = state.targetZoom;
                else state.viewZoom += zd * ZOOM_LERP_SPEED;
                if (state.isResetting) {
                    const dx = state.resetTargetX - state.viewX,
                        dy = state.resetTargetY - state.viewY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 3 && Math.abs(state.targetZoom - state.viewZoom) < 0.002) { state.viewX = state
                        .resetTargetX;
                        state.viewY = state.resetTargetY;
                        state.viewZoom = state.targetZoom;
                        state.isResetting = false; } else { state.viewX += dx * RESET_LERP_SPEED;
                        state.viewY += dy * RESET_LERP_SPEED; }
                }
                if (state.isFlying && state.flight) {
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const tt = state.flight.durationMin * 60;
                    updateFlightBarDisplay();
                    if (el / tt >= 1) completeFlight();
                }
                drawMap();
                state.animationId = requestAnimationFrame(gameLoop);
            }

            function updateFlightBarDisplay() {
                if (!state.flight || !state.isFlying) return;
                const el = Math.max(0, (Date.now() - state.flight.startTime) / 1000);
                const tt = state.flight.durationMin * 60;
                const rem = Math.max(0, tt - el);
                flightTimer.textContent = String(Math.floor(rem / 60)).padStart(2, '0') + ':' + String(Math.floor(rem %
                    60)).padStart(2, '0');
                flightDist.textContent = (state.flight.totalDistKm * Math.min(1, el / tt)).toFixed(3) + ' km';
            }

            function handleAirportClick(airport) {
                if (state.isFlying) return;
                const now = Date.now();
                if (now - state.lastAirportClickTime < 300) return;
                state.lastAirportClickTime = now;

                // ★ 简介气泡交互
                if (state.lorePopup) {
                    if (state.loreAirport && state.loreAirport.id === airport.id) { dismissLorePopup(); } else {
                        dismissLorePopup();
                        showLorePopup(airport); }
                } else { showLorePopup(airport); }

                // 起降点选择
                if (!state.departureAirport && !state.destinationAirport) { state.departureAirport = airport;
                    state.destinationAirport = null; } else if (state.departureAirport && !state.destinationAirport) {
                    if (state.departureAirport.id === airport.id) { state.departureAirport = null;
                        updateSelectionHint();
                        shakeSelectionHint(); return; }
                    state.destinationAirport = airport;
                    // ★ 选定终点后自动关闭气泡和tooltip
                    dismissLorePopup();
                    airportTooltip.classList.remove('visible');
                    state.tooltipAirport = null;
                    updateSelectionHint();
                    setTimeout(() => showDurationPanel(), 160);
                    return;
                } else { state.departureAirport = airport;
                    state.destinationAirport = null; }
                updateSelectionHint();
            }

            function updateSelectionHint() {
                if (state.isFlying) { selectionHint.style.opacity = '0'; return; }
                selectionHint.classList.remove('shake');
                if (!state.departureAirport && !state.destinationAirport) { selectionHint.textContent =
                        '👆 点击机场选择起点';
                    selectionHint.style.color = 'var(--text2)'; } else if (state.departureAirport && !state
                    .destinationAirport) { selectionHint.textContent = '👆 点击另一个机场选择终点';
                    selectionHint.style.color = '#22c55e'; } else { selectionHint.textContent = '✅ 起降点已选定';
                    selectionHint.style.color = 'var(--accent)'; }
                selectionHint.style.opacity = '1';
            }

            function shakeSelectionHint() { selectionHint.classList.remove('shake');
                void selectionHint.offsetWidth;
                selectionHint.classList.add('shake');
                selectionHint.style.color = '#ef4444';
                selectionHint.textContent = '⚠️ 起点与终点不能相同';
                setTimeout(updateSelectionHint, 800); }

            function clearAirportSelection() { state.departureAirport = null;
                state.destinationAirport = null;
                updateSelectionHint(); }

            function showLorePopup(airport) {
                dismissLorePopup();
                const popup = document.createElement('div');
                popup.className = 'airport-lore-popup';
                popup.id = 'lorePopup';
                popup.innerHTML = '<div class="lore-name">' + airport.name + '</div><div style="font-size:11px;color:var(--text2);">' +
                    airport.lore + '</div>';
                document.body.appendChild(popup);
                const sp = worldToScreen(airport.x, airport.y);
                const rect = canvas.getBoundingClientRect();
                let left = rect.left + sp.x + 20,
                    top = rect.top + sp.y - 55;
                if (left + 230 > window.innerWidth) left = window.innerWidth - 240;
                if (top < 40) top = rect.top + sp.y + 18;
                popup.style.left = left + 'px';
                popup.style.top = top + 'px';
                popup.addEventListener('click', (e) => { e.stopPropagation();
                    dismissLorePopup(); });
                state.lorePopup = popup;
                state.loreAirport = airport;
            }

            function dismissLorePopup() {
                if (state.lorePopup && state.lorePopup.parentNode) state.lorePopup.remove();
                state.lorePopup = null;
                state.loreAirport = null;
            }

                    (ad / 30).toFixed(1) +

            function generateTicket(dm, ad) {
                const from = state.departureAirport,
                    to = state.destinationAirport;
                if (!from || !to || from.id === to.id) { clearAirportSelection(); return; }
                const fn = 'FF' + String(Math.floor(Math.random() * 9000) + 1000);
                const ds = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' +
                    String(new Date().getDate()).padStart(2, '0');
                const overlay = document.createElement('div');
                overlay.id = 'ticketOverlay';
                overlay.innerHTML = '<div class="ticket-card"><div class="ticket-top"><div class="ticket-header"><div class="flight-no">' +
                    fn + '</div><div style="font-size:10px;color:var(--text2);">专注飞行 · 电子机票</div></div>' +
                    '<div class="ticket-route">' + from.name + ' <span class="arrow">✈️ ➤</span> ' + to.name +
                    '</div><div class="ticket-info">日期 <span>' + ds + '</span> &nbsp;·&nbsp; 专注 <span>' + dm +
                    '分钟</span><br>里程 <span>' + ad.toFixed(1) + ' km</span> &nbsp;·&nbsp; 航班 <span>' + fn +
                    '</span></div></div><div class="ticket-dashed-sep"></div><div class="ticket-tear-area" id="tearArea">' +
                    '<div class="ticket-tear-hint">👆 向右滑动撕开机票</div><div class="ticket-tear-bar" id="tearBar"><div class="ticket-tear-fill" id="tearFill"></div></div>' +
                    '<div class="ticket-tear-label">滑动进度 <span id="tearPct">0</span>%</div></div></div>';
                document.body.appendChild(overlay);
                const tearBar = overlay.querySelector('#tearBar'),
                    tearFill = overlay.querySelector('#tearFill'),
                    tearPct = overlay.querySelector('#tearPct');
                let prog = 0,
                    dragging = false,
                    done = false;

                function ut(cx) { if (done) return;
                    prog = Math.max(0, Math.min(1, (cx - tearBar.getBoundingClientRect().left) / tearBar
                        .getBoundingClientRect().width));
                    tearFill.style.width = (prog * 100) + '%';
                    tearPct.textContent = Math.floor(prog * 100); if (prog >= 0.88) ft(); }

                function ft() { if (done) return;
                    done = true;
                    tearFill.style.width = '100%';
                    tearPct.textContent = '100'; if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    window.removeEventListener('mousemove', mm);
                    window.removeEventListener('mouseup', mu);
                    setTimeout(() => { if (overlay.parentNode) overlay.remove();
                        beginFlight(dm, ad, fn); }, 400); }

                function rt() { if (!done) { prog = 0;
                        tearFill.style.width = '0%';
                        tearPct.textContent = '0'; } }
                const tearArea = overlay.querySelector('#tearArea');
                tearArea.addEventListener('touchstart', e => { dragging = true;
                    ut(e.touches[0].clientX); }, { passive: true });
                tearArea.addEventListener('touchmove', e => { if (dragging) ut(e.touches[0].clientX); }, { passive: true });
                tearArea.addEventListener('touchend', () => { dragging = false; if (prog < 0.88) rt(); });
                tearArea.addEventListener('touchcancel', () => { dragging = false; if (prog < 0.88) rt(); });
                const mm = e => { if (dragging && document.getElementById('ticketOverlay')) ut(e.clientX); };
                const mu = () => { if (!dragging) return;
                    dragging = false; if (prog < 0.88) rt(); };
                tearArea.addEventListener('mousedown', e => { dragging = true;
                    ut(e.clientX); });
                window.addEventListener('mousemove', mm);
                window.addEventListener('mouseup', mu);
                overlay.addEventListener('click', e => { if (e.target === overlay && prog < 0.1 && !done) { window
                        .removeEventListener('mousemove', mm);
                        window.removeEventListener('mouseup', mu);
                        overlay.remove();
                        clearAirportSelection(); } });
            }

            function beginFlight(dm, td, fn) {
                const f = state.departureAirport,
                    t = state.destinationAirport;
                if (!f || !t) return;
                state.flight = { from: f, to: t, durationMin: dm, totalDistKm: td, flightNo: fn, startTime: Date.now() };
                state.isFlying = true;
                state.departureAirport = null;
                state.destinationAirport = null;
                state.isResetting = false;
                flightBar.classList.remove('hidden');
                flightRouteLabel.textContent = f.name + ' → ' + t.name;
                selectionHint.style.opacity = '0';
                updateFlightBarDisplay();
                requestWakeLock();
                window._fa = true;
            }

            function completeFlight() {
                const fl = state.flight;
                if (!fl) return;
                state.history.unshift({ fromName: fl.from.name, toName: fl.to.name, durationMin: fl.durationMin,
                    km: fl.totalDistKm, flightNo: fl.flightNo, date: new Date().toISOString() });
                state.totalKm += fl.totalDistKm;
                state.totalFocusMin += fl.durationMin;
                saveData();
                state.flight = null;
                state.isFlying = false;
                flightBar.classList.add('hidden');
                window._fa = false;
                releaseWakeLock();
                updateSelectionHint();
                showCelebration(fl.totalDistKm);
                checkAchievements();
            }

                document.body.appendChild(o);

                o.addEventListener('click', e => { if (e.target === o) o.remove(); });

            function resetView() {
                state.isResetting = true;
                if (state.isFlying && state.flight) {
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const prog = Math.min(1, Math.max(0, el / (state.flight.durationMin * 60)));
                    state.resetTargetX = state.flight.from.x + (state.flight.to.x - state.flight.from.x) * prog;
                    state.resetTargetY = state.flight.from.y + (state.flight.to.y - state.flight.from.y) * prog;
                } else { state.resetTargetX = MAP_W / 2;
                    state.resetTargetY = MAP_H / 2; }
                state.targetZoom = state.defaultZoom;
            }

                t.innerHTML =
                    '<div style="font-size:48px;">🛬</div><div style="font-size:20px;font-weight:700;color:#fff;margin-top:6px;">抵达目的地！</div><div style="font-size:13px;color:var(--accent2);margin-top:4px;">本次飞行 ' +
                    km.toFixed(1) + ' 公里</div>';

            // ★ 检查所有成就（含导入后调用）
            function checkAchievements() {
                let anyNew = false;
                for (const ach of ALL_ACHIEVEMENTS) {
                    const currentVal = ach.type === 'dist' ? state.totalKm : state.totalFocusMin;
                    if (currentVal >= ach.threshold && !state.unlockedAchievements.find(a => a.name === ach.name && a
                            .type === ach.type)) {
                        state.unlockedAchievements.push({ name: ach.name, type: ach.type });
                        anyNew = true;
                        showAchievementPopup(ach);

                }
                if (anyNew) saveData();

            function showAchievementPopup(ach) {

            function renderRecords() {

                for (const r of state.history) {

                    const div = document.createElement('div');

                        .toName + '</div><div class="meta">' + ds + ' · ' + r.durationMin + '分钟 · ' + r.flightNo +

            function exportData() {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify({ totalKm: state.totalKm, totalFocusMin: state
                            .totalFocusMin, history: state.history,
                        unlockedAchievements: state.unlockedAchievements, exportedAt: new Date().toISOString() },
                        null, 2)], { type: 'application/json' }));
                a.download = 'focus-flight-data.json';
                a.click();
                URL.revokeObjectURL(a.href);
            }

            // ★ 导入后自动检查成就
            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.history || !Array.isArray(data.history)) throw new Error('无效');
                        state.totalKm = Math.max(state.totalKm, data.totalKm || 0);
                        state.totalFocusMin = Math.max(state.totalFocusMin, data.totalFocusMin || 0);
                        if (data.unlockedAchievements)
                            for (const a of data.unlockedAchievements)
                                if (!state.unlockedAchievements.find(x => x.name === a.name && x.type === a.type))
                                    state.unlockedAchievements.push(a);
                        const ek = new Set(state.history.map(h => (h.date || '') + '_' + (h.flightNo || '')));
                        if (data.history)
                            for (const h of data.history) { const k = (h.date || '') + '_' + (h.flightNo || ''); if (!ek
                                    .has(k)) { state.history.push(h);
                                    ek.add(k); } }
                        state.history.sort((a, b) => new Date(b.date) - new Date(a.date));
                        saveData();
                        renderRecords();
                        renderAchievements();
                        // ★ 导入后立即检查成就
                        checkAchievements();
                        alert('导入成功！');
                    } catch (err) { alert('导入失败：格式不正确'); }
                };
                reader.readAsText(file);
            }

            async function requestWakeLock() {
                try { if ('wakeLock' in navigator) { state.wakeLock = await navigator.wakeLock.request('screen');
                        state.wakeLock.addEventListener('release', () => {}); } } catch (e) {}
            }
            async function releaseWakeLock() { if (state.wakeLock) { try { await state.wakeLock.release(); } catch (
                e) {} state.wakeLock = null; } }

            // ═══════════════════ Canvas 触摸 ═══════════════════
            function getTD(t) { return Math.sqrt((t[0].clientX - t[1].clientX) ** 2 + (t[0].clientY - t[1].clientY) ** 2); }

            function getTC(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }

            function getCP(e) {
                const r = canvas.getBoundingClientRect();
                return { x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left, y: (e.touches ? e.touches[0].clientY :
                        e.clientY) - r.top };
            }

            function hPD(e) {
                e.preventDefault();
                const t = e.touches;
                if (!t || !t.length) return;
                if (t.length === 2) { state.isPinching = true;
                    state.panStart = null;
                    state.pendingClickAirport = null;
                    state.pinchStartDist = getTD(t);
                    state.pinchStartZoom = state.viewZoom; const c = getTC(t);
                    state.pinchCenterX = c.x;
                    state.pinchCenterY = c.y; return; }
                state.isPinching = false;
                const p = getCP(e);
                state.pointerDownPos = p;
                state.pointerMoved = false;
                const hit = hitTestAirport(p.x, p.y);
                if (hit && !state.isFlying) { state.pendingClickAirport = hit;
                    state.panStart = null; } else { state.pendingClickAirport = null;
                    state.panStart = { x: p.x, y: p.y, vx: state.viewX, vy: state.viewY }; }
            }

            function hPM(e) {
                e.preventDefault();
                const t = e.touches;
                if (!t || !t.length) return;
                if (t.length === 2 && state.isPinching) {
                    const nd = getTD(t);
                    state.viewZoom = clampZoom(state.pinchStartZoom * (nd / Math.max(state.pinchStartDist, 1)));
                    state.targetZoom = state.viewZoom;
                    const c = getTC(t);
                    state.viewX -= (c.x - state.pinchCenterX) / state.viewZoom;
                    state.viewY -= (c.y - state.pinchCenterY) / state.viewZoom;
                    state.pinchCenterX = c.x;
                    state.pinchCenterY = c.y;
                    clampViewport();
                    state.panStart = null;
                    state.pendingClickAirport = null;
                    state.pointerMoved = true;
                    return;
                }
                if (t.length === 1 && !state.isPinching) {
                    const p = getCP(e);
                    if (Math.abs(p.x - state.pointerDownPos.x) > CLICK_MOVE_THRESHOLD || Math.abs(p.y - state
                            .pointerDownPos.y) > CLICK_MOVE_THRESHOLD) { state.pointerMoved = true;
                        state.pendingClickAirport = null; }
                    if (state.panStart) { state.viewX = state.panStart.vx - (p.x - state.panStart.x) / state.viewZoom;
                        state.viewY = state.panStart.vy - (p.y - state.panStart.y) / state.viewZoom;
                        clampViewport(); }
                    if (!state.isFlying && !state.panStart) {
                        const hit = hitTestAirport(p.x, p.y);
                        if (hit !== state.tooltipAirport) { state.tooltipAirport = hit; if (hit) {
                                airportTooltip.textContent = hit.name;
                                const cr = canvas.getBoundingClientRect();
                                airportTooltip.style.left = (cr.left + p.x + 16) + 'px';
                                airportTooltip.style.top = (cr.top + p.y - 30) + 'px';
                                airportTooltip.classList.add('visible'); } else airportTooltip.classList.remove(
                                'visible'); }
                    }
                }
            }

            function hPU(e) {
                const t = e.touches;
                if ((!t || t.length < 2) && state.isPinching) { state.isPinching = false;
                    state.targetZoom = state.viewZoom; }
                if (!state.isFlying && !state.isPinching && !state.pointerMoved && state.pendingClickAirport)
                    handleAirportClick(state.pendingClickAirport);
                state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false;
            }
            canvas.addEventListener('touchstart', hPD, { passive: false });
            canvas.addEventListener('touchmove', hPM, { passive: false });
            canvas.addEventListener('touchend', hPU);
            canvas.addEventListener('touchcancel', hPU);
            canvas.addEventListener('mousedown', e => {
                const p = getCP(e);
                state.pointerDownPos = p;
                state.pointerMoved = false;
                const hit = hitTestAirport(p.x, p.y);
                if (hit && !state.isFlying) { state.pendingClickAirport = hit;
                    state.panStart = null; } else { state.pendingClickAirport = null;
                    state.panStart = { x: p.x, y: p.y, vx: state.viewX, vy: state.viewY }; }
            });
            canvas.addEventListener('mousemove', e => {
                if (state.panStart) {
                    const p = getCP(e);
                    if (Math.abs(p.x - state.pointerDownPos.x) > CLICK_MOVE_THRESHOLD || Math.abs(p.y - state
                            .pointerDownPos.y) > CLICK_MOVE_THRESHOLD) { state.pointerMoved = true;
                        state.pendingClickAirport = null; }
                    state.viewX = state.panStart.vx - (p.x - state.panStart.x) / state.viewZoom;
                    state.viewY = state.panStart.vy - (p.y - state.panStart.y) / state.viewZoom;
                    clampViewport();
                }
            });
            canvas.addEventListener('mouseup', () => {
                if (!state.isFlying && !state.pointerMoved && state.pendingClickAirport) handleAirportClick(state
                    .pendingClickAirport);
                state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false;
            });
            canvas.addEventListener('mouseleave', () => { state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false; });
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const p = getCP(e);
                const wb = screenToWorld(p.x, p.y);
                state.viewZoom = clampZoom(state.viewZoom * (e.deltaY > 0 ? 0.87 : 1.13));
                state.targetZoom = state.viewZoom;
                const wa = screenToWorld(p.x, p.y);
                state.viewX += wb.x - wa.x;
                state.viewY += wb.y - wa.y;
                clampViewport();
            }, { passive: false });

            cancelFlightBtn.addEventListener('click', cancelFlight);
            resetViewBtn.addEventListener('click', resetView);

            // ═══════════════════ ★ 视图切换（隐藏飞行信息） ═══════════════════
            function switchView(v) {
                state.currentView = v;
                navButtons.forEach(b => b.classList.toggle('active', b.dataset.view === v));
                const im = v === 'map';
                selectionHint.style.display = im ? '' : 'none';
                // ★ 切换页面时：飞行信息栏仅在地图视图显示
                if (!im && state.isFlying) {
                    flightBar.classList.add('hidden');
                } else if (im && state.isFlying) {
                    flightBar.classList.remove('hidden');
                }
                recordsPage.classList.toggle('active', v === 'records');
                achievementsPage.classList.toggle('active', v === 'achievements');
                dismissLorePopup();
                if (v === 'records') renderRecords();
                if (v === 'achievements') renderAchievements();
                if (v === 'map') updateSelectionHint();
            }
            navButtons.forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]);
                importFileInput.value = ''; });
            window.addEventListener('beforeunload', e => { if (window._fa) { e.preventDefault();
                    e.returnValue = '飞行正在进行中，确定离开吗？'; return e.returnValue; } });
            document.addEventListener('visibilitychange', () => { if (document.hidden && state.isFlying) releaseWakeLock();
                else if (!document.hidden && state.isFlying) requestWakeLock(); });
            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('gesturechange', e => e.preventDefault());
            document.addEventListener('gestureend', e => e.preventDefault());
            document.addEventListener('click', (e) => {
                if (state.lorePopup && !e.target.closest('.airport-lore-popup') && !e.target.closest('canvas'))
                    dismissLorePopup();
            });

            function setupPWA() {
                const m = { name: '专注飞行', short_name: '专注飞行', description: '在专注中飞向远方',
                    start_url: location.href, display: 'standalone', orientation: 'portrait',
                    background_color: '#070b14', theme_color: '#070b14', icons: [{ src: 'data:image/svg+xml,' +
                            encodeURIComponent(
                                '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="32" fill="#070b14"/><text x="96" y="115" text-anchor="middle" font-size="80">✈️</text></svg>'
                                ), sizes: '192x192', type: 'image/svg+xml' }] };
                const l = document.createElement('link');
                l.rel = 'manifest';
                l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/json' }));
                document.head.appendChild(l);
                if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([
                    "const C='ff-v14';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['" +
                    location.href + "'])).catch(()=>{}))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(r2=>{if(r2.ok){caches.open(C).then(c=>c.put(e.request,r2.clone()));}return r2;})))});"
                ], { type: 'application/javascript' }))).catch(() => {});
            }

            function init() {
                loadData();
                generateTerrainAndRivers();
                placeAirports();
                resizeCanvas();
                state.viewX = MAP_W / 2;
                state.viewY = MAP_H / 2;
                state.viewZoom = state.defaultZoom;
                state.targetZoom = state.defaultZoom;
                switchView('map');
                gameLoop();
                setupPWA();
                window.addEventListener('resize', () => { resizeCanvas();
                    clampViewport(); });
            }
            init();
            console.log('🛩️ 专注飞行 v14 | 机场:' + state.airports.length + ' | 里程:' + Math.floor(state.totalKm) +
                'km | 专注:' + Math.floor(state.totalFocusMin) + 'min');
        })();
    </script>
</body>
</html>
