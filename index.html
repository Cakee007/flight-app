<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#070b14">
    <title>专注飞行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #070b14;
            --bg2: #0d1225;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --accent: #60a5fa;
            --accent2: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --nav-h: 60px;
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-t: env(safe-area-inset-top, 0px);
            --border: rgba(255, 255, 255, 0.08);
            --border2: rgba(255, 255, 255, 0.14);
            --gold: #fbbf24;
            --card: rgba(20, 26, 42, 0.8);
            --touch-min: 44px;
            --nav-total: calc(var(--nav-h) + var(--safe-b));
            --acrylic: rgba(18, 24, 40, 0.72);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100dvh;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #canvasContainer {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        #mapCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #060b18;
            touch-action: none;
        }
        #resetViewBtn {
            position: fixed;
            bottom: calc(var(--nav-total) + 20px);
            right: 16px;
            z-index: 15;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--acrylic);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border2);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s;
        }
        #resetViewBtn:active {
            transform: scale(0.88);
            background: rgba(96, 165, 250, 0.25);
            border-color: var(--accent);
        }
        #bottomNav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            height: var(--nav-total);
            padding-bottom: var(--safe-b);
            background: var(--acrylic);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            border-top: 1px solid var(--border);
        }
        #bottomNav button {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 44px;
        }
        #bottomNav button.active {
            color: var(--accent);
        }
        #bottomNav button i {
            font-size: 18px;
        }
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .panel {
            background: var(--acrylic);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 24px 20px;
            width: 88%;
            max-width: 370px;
            border: 1px solid var(--border2);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }
        .panel h2 {
            font-size: 20px;
            margin-bottom: 6px;
            text-align: center;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .panel .subtitle {
            font-size: 13px;
            color: var(--text2);
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 22px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: var(--touch-min);
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            color: #fff;
            width: 100%;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border2);
            color: var(--text);
        }
        .btn-sm {
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 12px;
            min-height: 40px;
        }
        .duration-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 14px 0;
        }
        .duration-opt {
            flex: 1;
            min-width: 48px;
            padding: 14px 6px;
            border-radius: 14px;
            border: 1.5px solid var(--border2);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            min-height: var(--touch-min);
        }
        .duration-opt.selected {
            border-color: var(--accent);
            background: rgba(96, 165, 250, 0.15);
            color: var(--accent);
            box-shadow: 0 0 16px rgba(96, 165, 250, 0.2);
        }

        /* ═══════════════════ ★ 机票撕开效果（横向撕票）★ ═══════════════════ */
        #ticketOverlay {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .ticket-card {
            width: 90%;
            max-width: 350px;
            background: var(--acrylic);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border2);
            box-shadow: 0 20px 56px rgba(0, 0, 0, 0.55);
            overflow: visible;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .ticket-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #22c55e, #60a5fa, #a78bfa, #f59e0b);
            z-index: 5;
            border-radius: 20px 20px 0 0;
        }
        /* 上半部分：航班信息 */
        .ticket-top {
            padding: 20px 16px 12px;
            position: relative;
            z-index: 3;
        }
        .ticket-header {
            text-align: center;
            margin-bottom: 8px;
        }
        .ticket-header .flight-no {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--accent);
        }
        .ticket-route {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            flex-wrap: wrap;
        }
        .ticket-route .arrow {
            color: var(--accent2);
            font-size: 16px;
        }
        .ticket-info {
            font-size: 11px;
            color: var(--text2);
            line-height: 1.7;
            text-align: center;
        }
        .ticket-info span {
            color: #fff;
            font-weight: 600;
        }

        /* 横向虚线分隔线 */
        .ticket-dashed-sep {
            position: relative;
            z-index: 4;
            border-top: 2px dashed rgba(255, 255, 255, 0.25);
            margin: 0 14px;
            height: 1px;
        }
        /* 虚线两侧的半圆齿孔 */
        .ticket-dashed-sep::before,
        .ticket-dashed-sep::after {
            content: '';
            position: absolute;
            top: -11px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #070b14;
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 6;
        }
        .ticket-dashed-sep::before {
            left: -26px;
        }
        .ticket-dashed-sep::after {
            right: -26px;
        }

        /* 下半部分：可撕区域 */
        .ticket-tear-strip {
            position: relative;
            z-index: 3;
            padding: 16px 14px 18px;
            text-align: center;
            cursor: grab;
            background: rgba(245, 158, 11, 0.05);
            border-radius: 0 0 18px 18px;
            transition: none;
            will-change: transform;
            transform-origin: top center;
            perspective: 600px;
            -webkit-perspective: 600px;
            overflow: hidden;
        }
        .ticket-tear-strip:active {
            cursor: grabbing;
        }
        .ticket-tear-strip.torn-off {
            transition: transform 0.8s cubic-bezier(0.55, 0, 0.45, 1), opacity 0.6s ease 0.3s;
            transform: perspective(500px) rotateX(85deg) translateY(80px);
            opacity: 0;
            pointer-events: none;
        }
        .tear-hint-text {
            font-size: 14px;
            color: var(--accent2);
            animation: pulse 1.5s ease-in-out infinite;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }
        .tear-swipe-arrow {
            display: inline-block;
            font-size: 20px;
            color: var(--accent2);
            animation: swipeHint 2s ease-in-out infinite;
        }
        @keyframes swipeHint {
            0%,
            100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(12px);
            }
        }
        /* 撕裂进度指示器 */
        .tear-progress-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #ef4444, #f59e0b);
            border-radius: 0 0 0 18px;
            transition: width 0.05s linear;
            width: 0%;
            z-index: 7;
        }

        /* 飞行状态栏 */
        #flightBar {
            position: fixed;
            top: max(12px, var(--safe-t, 12px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            background: var(--acrylic);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border2);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            font-size: 12px;
            white-space: nowrap;
        }
        #flightBar .timer {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            min-width: 58px;
            text-align: center;
        }
        #flightBar .dist {
            color: var(--accent2);
            font-size: 12px;
            min-width: 74px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        #flightBar button {
            padding: 7px 14px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.5);
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            min-height: 36px;
        }
        .confetti {
            position: fixed;
            z-index: 80;
            pointer-events: none;
            animation: confettiFall linear forwards;
            font-size: 22px;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-120px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
        .achievement-card {
            background: var(--acrylic);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--gold);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 48px rgba(251, 191, 36, 0.25);
        }
        .achievement-card .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .achievement-card .name {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
        }
        .page {
            position: fixed;
            inset: 0;
            bottom: var(--nav-total);
            z-index: 20;
            background: rgba(7, 11, 20, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px 14px;
            -webkit-overflow-scrolling: touch;
        }
        .page.active {
            display: flex;
        }
        .page h2 {
            font-size: 22px;
            margin-bottom: 14px;
            color: #fff;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .record-item {
            background: rgba(20, 26, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            gap: 8px;
        }
        .record-item .route {
            font-weight: 600;
            color: #fff;
            font-size: 13px;
        }
        .record-item .meta {
            color: var(--text2);
            font-size: 11px;
        }
        .record-item .km {
            color: var(--accent2);
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }
        .achievement-item {
            background: rgba(20, 26, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .achievement-item.unlocked {
            border-color: rgba(251, 191, 36, 0.5);
            background: rgba(251, 191, 36, 0.06);
        }
        .achievement-item.locked {
            opacity: 0.45;
        }
        .page-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .airport-tooltip {
            position: fixed;
            z-index: 25;
            background: var(--acrylic);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 12px;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.15s;
        }
        .airport-tooltip.visible {
            opacity: 1;
        }
        #selectionHint {
            position: fixed;
            bottom: calc(var(--nav-total) + 14px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            background: var(--acrylic);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border2);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 12px;
            color: var(--text2);
            white-space: nowrap;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
            max-width: 90vw;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(-50%);
            }
            20% {
                transform: translateX(calc(-50% + 6px));
            }
            40% {
                transform: translateX(calc(-50% - 6px));
            }
            60% {
                transform: translateX(calc(-50% + 4px));
            }
            80% {
                transform: translateX(calc(-50% - 4px));
            }
        }
        .shake {
            animation: shake 0.5s ease;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mt-16 {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvasContainer"><canvas id="mapCanvas"></canvas></div>
        <button id="resetViewBtn" aria-label="复位视角">📍</button>
        <div id="flightBar" class="hidden">
            <span class="timer" id="flightTimer">00:00</span>
            <span class="dist" id="flightDist">0.000 km</span>
            <button id="cancelFlightBtn">取消</button>
        </div>
        <div id="selectionHint">👆 点击机场选择起点</div>
        <div class="airport-tooltip" id="airportTooltip"></div>
        <div class="page" id="recordsPage">
            <h2>📋 飞行记录</h2>
            <div id="recordsList"></div>
            <div class="page-actions">
                <button class="btn btn-sm btn-ghost" id="exportBtn"><i class="fa-solid fa-download"></i> 导出JSON</button>
                <button class="btn btn-sm btn-ghost" id="importBtn"><i class="fa-solid fa-upload"></i> 导入JSON</button>
            </div>
            <input type="file" id="importFileInput" accept=".json" class="hidden">
        </div>
        <div class="page" id="achievementsPage">
            <h2>🏆 成就</h2>
            <div id="achievementsList"></div>
            <p class="text-center" style="color:var(--text2);margin-top:8px;">总里程：<strong id="totalKmDisplay" style="color:var(--accent2);">0</strong> 公里</p>
        </div>
        <nav id="bottomNav">
            <button class="active" data-view="map"><i class="fa-solid fa-map"></i>地图</button>
            <button data-view="records"><i class="fa-solid fa-list"></i>记录</button>
            <button data-view="achievements"><i class="fa-solid fa-trophy"></i>成就</button>
        </nav>
    </div>

    <script>
        (function() {
            const MAP_W = 6000,
                MAP_H = 4500,
                CELL_SIZE = 40;
            const COLS = MAP_W / CELL_SIZE,
                ROWS = MAP_H / CELL_SIZE;
            const UNITS_PER_KM = 8;
            const MIN_AIRPORT_DIST = 380;
            const AIRPORT_COUNT = 22;
            const ZOOM_LERP_SPEED = 0.1;
            const MIN_ZOOM = 0.18,
                MAX_ZOOM = 4.5;
            const RESET_LERP_SPEED = 0.1;
            const CLICK_MOVE_THRESHOLD = 8;
            const PLANE_BODY_RX = 10,
                PLANE_BODY_RY = 4.5,
                PLANE_SCALE_BASE = 0.75;
            const TEAR_PROGRESS_THRESHOLD = 0.85;

            const AIRPORT_NAMES = [
                '星辰彼岸空港', '深渊回响基地', '苍穹断章机场', '极光幻境空港', '虚空之门机场',
                '时光裂隙基地', '雷霆之翼空港', '暮光序章机场', '银河渡口基地', '风暴之眼空港',
                '黎明挽歌机场', '幻梦浮岛基地', '暗影苍穹空港', '永恒回廊机场', '极星天枢基地',
                '落日余烬空港', '冰霜王座机场', '星辉彼岸基地', '月辉圣殿空港', '破晓征途机场',
                '幽蓝深谷空港', '炽焰要塞基地', '潮汐圣殿机场', '虚空回响空港', '极夜灯塔机场'
            ];

            const ACHIEVEMENTS = [
                { threshold: 100, name: '云中漫步', icon: '☁️', desc: '累计飞行100公里' },
                { threshold: 500, name: '苍穹旅人', icon: '🌤️', desc: '累计飞行500公里' },
                { threshold: 2000, name: '次元穿越者', icon: '🌌', desc: '累计飞行2000公里' },
                { threshold: 10000, name: '星海归航', icon: '🌟', desc: '累计飞行10000公里' },
            ];

            const TERRAIN_TYPES = [
                { name: 'deep_water', color: '#1a3a5c', weight: 12 },
                { name: 'water', color: '#2a5f8a', weight: 10 },
                { name: 'plains', color: '#5a8c3e', weight: 18 },
                { name: 'light_plains', color: '#7aaa4a', weight: 10 },
                { name: 'forest', color: '#3d6b2e', weight: 14 },
                { name: 'mountain', color: '#7a6b5c', weight: 12 },
                { name: 'high_mountain', color: '#9e8e7e', weight: 8 },
                { name: 'snow', color: '#d8dce6', weight: 6 },
                { name: 'desert', color: '#c4a855', weight: 6 },
                { name: 'red_rock', color: '#b85a3a', weight: 4 },
            ];

            function calcDistanceKm(from, to) {
                return Math.sqrt((to.x - from.x) ** 2 + (to.y - from.y) ** 2) / UNITS_PER_KM;
            }

            const state = {
                terrainGrid: [],
                airports: [],
                rivers: [],
                clouds: [],
                departureAirport: null,
                destinationAirport: null,
                flight: null,
                isFlying: false,
                viewX: MAP_W / 2,
                viewY: MAP_H / 2,
                viewZoom: 1,
                defaultZoom: 1,
                targetZoom: 1,
                pinchStartDist: 0,
                pinchStartZoom: 1,
                pinchCenterX: 0,
                pinchCenterY: 0,
                isPinching: false,
                panStart: null,
                pointerDownPos: { x: 0, y: 0 },
                pointerMoved: false,
                pendingClickAirport: null,
                isResetting: false,
                resetTargetX: MAP_W / 2,
                resetTargetY: MAP_H / 2,
                totalKm: 0,
                history: [],
                unlockedAchievements: [],
                currentView: 'map',
                wakeLock: null,
                tooltipAirport: null,
                animationId: null,
                baseDisplayW: 0,
                baseDisplayH: 0,
                lastAirportClickTime: 0,
            };

            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            const canvasContainer = document.getElementById('canvasContainer');
            const flightBar = document.getElementById('flightBar');
            const flightTimer = document.getElementById('flightTimer');
            const flightDist = document.getElementById('flightDist');
            const cancelFlightBtn = document.getElementById('cancelFlightBtn');
            const selectionHint = document.getElementById('selectionHint');
            const airportTooltip = document.getElementById('airportTooltip');
            const recordsPage = document.getElementById('recordsPage');
            const achievementsPage = document.getElementById('achievementsPage');
            const recordsList = document.getElementById('recordsList');
            const achievementsList = document.getElementById('achievementsList');
            const totalKmDisplay = document.getElementById('totalKmDisplay');
            const navButtons = document.querySelectorAll('#bottomNav button');
            const importFileInput = document.getElementById('importFileInput');
            const resetViewBtn = document.getElementById('resetViewBtn');

            // ═══════════════════ 存储 / 地形 / 机场 …（与上一版完全相同） ═══════════════════
            function saveData() {
                try { localStorage.setItem('ff_data', JSON.stringify({ totalKm: state.totalKm, history: state.history,
                        unlockedAchievements: state.unlockedAchievements })); } catch (e) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem('ff_data');
                    if (raw) { const d = JSON.parse(raw);
                        state.totalKm = d.totalKm || 0;
                        state.history = d.history || [];
                        state.unlockedAchievements = d.unlockedAchievements || []; }
                } catch (e) {}
            }

            function generateTerrainAndRivers() {
                const seeds = [];
                const tw = TERRAIN_TYPES.reduce((s, t) => s + t.weight, 0);
                for (let i = 0; i < 55; i++) {
                    let r = Math.random() * tw,
                        acc = 0,
                        ti = 0;
                    for (let j = 0; j < TERRAIN_TYPES.length; j++) { acc += TERRAIN_TYPES[j].weight; if (r <= acc) { ti =
                                j; break; } }
                    seeds.push({ x: Math.random() * MAP_W, y: Math.random() * MAP_H, type: ti });
                }
                const grid = [];
                for (let row = 0; row < ROWS; row++) {
                    grid[row] = [];
                    for (let col = 0; col < COLS; col++) {
                        const cx = (col + 0.5) * CELL_SIZE,
                            cy = (row + 0.5) * CELL_SIZE;
                        let md = Infinity,
                            bt = 0;
                        for (const s of seeds) { const d = (cx - s.x) ** 2 + (cy - s.y) ** 2; if (d < md) { md = d;
                                bt = s.type; } }
                        grid[row][col] = bt;
                    }
                }
                state.terrainGrid = grid;
                const rivers = [];
                for (let i = 0; i < 12; i++) {
                    const pts = [];
                    let sx = Math.random() * MAP_W,
                        sy = Math.random() * MAP_H * 0.5 + MAP_H * 0.2;
                    const len = 8 + Math.floor(Math.random() * 20);
                    for (let j = 0; j < len; j++) { pts.push({ x: sx, y: sy });
                        sx += (Math.random() - 0.35) * 150;
                        sy += Math.random() * 100 + 40; if (sx < 0 || sx > MAP_W || sy > MAP_H) break; }
                    if (pts.length >= 5) rivers.push(pts);
                }
                state.rivers = rivers;
                const clouds = [];
                for (let i = 0; i < 40; i++) clouds.push({ x: Math.random() * MAP_W, y: Math.random() * MAP_H, r: 60 + Math
                        .random() * 140, alpha: 0.04 + Math.random() * 0.08 });
                state.clouds = clouds;
            }

            function placeAirports() {
                const names = [...AIRPORT_NAMES];
                for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));
                    [names[i], names[j]] = [names[j], names[i]]; }
                const sel = names.slice(0, AIRPORT_COUNT);
                const airports = [];
                for (const name of sel) {
                    let placed = false;
                    for (let a = 0; a < 5000; a++) {
                        const x = 150 + Math.random() * (MAP_W - 300),
                            y = 150 + Math.random() * (MAP_H - 300);
                        const c = Math.floor(x / CELL_SIZE),
                            r = Math.floor(y / CELL_SIZE);
                        if ((state.terrainGrid[r]?.[c] || 0) === 0) continue;
                        let tc = false;
                        for (const ap of airports) { if ((x - ap.x) ** 2 + (y - ap.y) ** 2 < MIN_AIRPORT_DIST ** 2) { tc =
                                    true; break; } }
                        if (!tc) { airports.push({ x, y, name, id: 'ap_' + airports.length });
                            placed = true; break; }
                    }
                    if (!placed) airports.push({ x: 200 + Math.random() * (MAP_W - 400), y: 200 + Math.random() * (
                            MAP_H - 400), name, id: 'ap_' + airports.length });
                }
                state.airports = airports;
            }

            function resizeCanvas() {
                const rect = canvasContainer.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                state.baseDisplayW = rect.width;
                state.baseDisplayH = rect.height;
                state.defaultZoom = Math.min(rect.width / MAP_W, rect.height / MAP_H) * 0.92;
                if (!state.isResetting) { state.viewZoom = state.defaultZoom;
                    state.targetZoom = state.defaultZoom; }
            }

            function worldToScreen(wx, wy) {
                const dw = state.baseDisplayW || canvas.clientWidth,
                    dh = state.baseDisplayH || canvas.clientHeight;
                return { x: (wx - state.viewX) * state.viewZoom + dw / 2, y: (wy - state.viewY) * state.viewZoom + dh /
                    2 };
            }

            function screenToWorld(sx, sy) {
                const dw = state.baseDisplayW || canvas.clientWidth,
                    dh = state.baseDisplayH || canvas.clientHeight;
                return { x: (sx - dw / 2) / state.viewZoom + state.viewX, y: (sy - dh / 2) / state.viewZoom + state
                    .viewY };
            }

            function clampViewport() {
                const dw = state.baseDisplayW || canvas.clientWidth,
                    dh = state.baseDisplayH || canvas.clientHeight;
                const hw = (dw / 2) / state.viewZoom,
                    hh = (dh / 2) / state.viewZoom;
                state.viewX = Math.max(hw - 50, Math.min(MAP_W + 50 - hw, state.viewX));
                state.viewY = Math.max(hh - 50, Math.min(MAP_H + 50 - hh, state.viewY));
            }

            function clampZoom(z) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }

            function hitTestAirport(sx, sy) {
                const w = screenToWorld(sx, sy);
                const hr = 30 / state.viewZoom;
                let best = null,
                    bd = Infinity;
                for (const ap of state.airports) { const d = Math.sqrt((w.x - ap.x) ** 2 + (w.y - ap.y) ** 2); if (d < hr &&
                        d < bd) { best = ap;
                        bd = d; } }
                return best;
            }

            function drawMap() {
                const dw = state.baseDisplayW || canvas.clientWidth,
                    dh = state.baseDisplayH || canvas.clientHeight;
                ctx.clearRect(0, 0, dw, dh);
                const hw = dw / 2 / state.viewZoom,
                    hh = dh / 2 / state.viewZoom;
                const minCol = Math.max(0, Math.floor((state.viewX - hw) / CELL_SIZE));
                const maxCol = Math.min(COLS - 1, Math.ceil((state.viewX + hw) / CELL_SIZE));
                const minRow = Math.max(0, Math.floor((state.viewY - hh) / CELL_SIZE));
                const maxRow = Math.min(ROWS - 1, Math.ceil((state.viewY + hh) / CELL_SIZE));
                for (let r = minRow; r <= maxRow; r++) {
                    for (let c = minCol; c <= maxCol; c++) {
                        const sp = worldToScreen(c * CELL_SIZE, r * CELL_SIZE);
                        const cs = CELL_SIZE * state.viewZoom;
                        const ti = state.terrainGrid[r]?.[c] || 0;
                        const bc = TERRAIN_TYPES[ti].color;
                        const v = (Math.sin(r * 7.99 + c * 13.37) * 10000 % 1) * 8 - 4;
                        ctx.fillStyle = 'rgb(' + Math.max(0, Math.min(255, parseInt(bc.slice(1, 3), 16) + v | 0)) +
                            ',' + Math.max(0, Math.min(255, parseInt(bc.slice(3, 5), 16) + v | 0)) + ',' + Math.max(0,
                                Math.min(255, parseInt(bc.slice(5, 7), 16) + v | 0)) + ')';
                        ctx.fillRect(sp.x, sp.y, Math.ceil(cs) + 1, Math.ceil(cs) + 1);
                        ctx.strokeStyle = 'rgba(0,0,0,0.06)';
                        ctx.lineWidth = 0.4;
                        ctx.strokeRect(sp.x, sp.y, Math.ceil(cs), Math.ceil(cs));
                    }
                }
                for (const river of state.rivers) {
                    if (river.length < 2) continue;
                    ctx.beginPath();
                    const sp0 = worldToScreen(river[0].x, river[0].y);
                    ctx.moveTo(sp0.x, sp0.y);
                    for (let i = 1; i < river.length; i++) { const sp = worldToScreen(river[i].x, river[i].y);
                        ctx.lineTo(sp.x, sp.y); }
                    ctx.strokeStyle = 'rgba(100,160,210,0.35)';
                    ctx.lineWidth = Math.max(1.5, 3.5 * state.viewZoom);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(160,210,245,0.2)';
                    ctx.lineWidth = Math.max(0.8, 1.5 * state.viewZoom);
                    ctx.stroke();
                }
                for (const cl of state.clouds) {
                    const sp = worldToScreen(cl.x, cl.y);
                    if (sp.x < -200 || sp.x > dw + 200 || sp.y < -200 || sp.y > dh + 200) continue;
                    const r = cl.r * state.viewZoom;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + cl.alpha + ')';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sp.x - r * 0.5, sp.y - r * 0.15, r * 0.65, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(sp.x + r * 0.45, sp.y - r * 0.1, r * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                }
                if (!state.isFlying && state.departureAirport && state.destinationAirport) {
                    const fs = worldToScreen(state.departureAirport.x, state.departureAirport.y);
                    const ts = worldToScreen(state.destinationAirport.x, state.destinationAirport.y);
                    ctx.setLineDash([7, 9]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(fs.x, fs.y);
                    ctx.lineTo(ts.x, ts.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                for (const ap of state.airports) {
                    const sp = worldToScreen(ap.x, ap.y);
                    if (sp.x < -80 || sp.x > dw + 80 || sp.y < -80 || sp.y > dh + 80) continue;
                    const isDep = state.departureAirport && state.departureAirport.id === ap.id;
                    const isDest = state.destinationAirport && state.destinationAirport.id === ap.id;
                    const isFF = state.isFlying && state.flight && state.flight.from.id === ap.id;
                    const isFT = state.isFlying && state.flight && state.flight.to.id === ap.id;
                    const hl = isDep || isDest || isFF || isFT;
                    let gc, rc, dc;
                    if (isDep) { gc = 'rgba(34,197,94,0.5)';
                        rc = 'rgba(34,197,94,0.7)';
                        dc = '#22c55e'; } else if (isDest) { gc = 'rgba(239,68,68,0.5)';
                        rc = 'rgba(239,68,68,0.7)';
                        dc = '#ef4444'; } else if (isFF) { gc = 'rgba(96,165,250,0.45)';
                        rc = 'rgba(96,165,250,0.6)';
                        dc = '#60a5fa'; } else if (isFT) { gc = 'rgba(245,158,11,0.45)';
                        rc = 'rgba(245,158,11,0.6)';
                        dc = '#f59e0b'; } else { dc = '#e2e8f0'; }
                    if (hl) { ctx.beginPath();
                        ctx.arc(sp.x, sp.y, 18, 0, Math.PI * 2);
                        ctx.fillStyle = gc;
                        ctx.fill(); const pulse = Math.sin(Date.now() / 350) * 0.3 + 0.7;
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, 24 * pulse, 0, Math.PI * 2);
                        ctx.strokeStyle = rc;
                        ctx.lineWidth = 2.5;
                        ctx.stroke(); }
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, 9, 0, Math.PI * 2);
                    ctx.fillStyle = dc;
                    ctx.fill();
                    ctx.strokeStyle = '#060b18';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(sp.x - 4, sp.y);
                    ctx.lineTo(sp.x + 4, sp.y);
                    ctx.moveTo(sp.x, sp.y - 4);
                    ctx.lineTo(sp.x, sp.y + 4);
                    ctx.strokeStyle = '#060b18';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    const fs = Math.max(9, Math.min(14, 12 * state.viewZoom * 1.4));
                    ctx.fillStyle = '#fff';
                    ctx.font = '600 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ap.name, sp.x, sp.y - 16);
                }
                if (state.isFlying && state.flight) {
                    const fromSp = worldToScreen(state.flight.from.x, state.flight.from.y);
                    const toSp = worldToScreen(state.flight.to.x, state.flight.to.y);
                    ctx.setLineDash([7, 6]);
                    ctx.strokeStyle = 'rgba(245,158,11,0.5)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(fromSp.x, fromSp.y);
                    ctx.lineTo(toSp.x, toSp.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const tt = state.flight.durationMin * 60;
                    const prog = Math.min(1, Math.max(0, el / tt));
                    const dirX = state.flight.to.x - state.flight.from.x;
                    const dirY = state.flight.to.y - state.flight.from.y;
                    const psp = worldToScreen(state.flight.from.x + dirX * prog, state.flight.from.y + dirY * prog);
                    const angle = Math.atan2(dirY, dirX);
                    for (let t = 0; t < 6; t++) {
                        const tp = Math.max(0, prog - (t + 1) * 0.004);
                        const tsp = worldToScreen(state.flight.from.x + dirX * tp, state.flight.from.y + dirY * tp);
                        ctx.beginPath();
                        ctx.arc(tsp.x, tsp.y, Math.max(0.7, 3.5 - t * 0.5), 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0.03, 0.38 - t * 0.06) + ')';
                        ctx.fill();
                    }
                    ctx.save();
                    ctx.translate(psp.x, psp.y);
                    ctx.rotate(angle);
                    const sc = PLANE_SCALE_BASE / Math.max(0.45, state.viewZoom);
                    ctx.scale(sc, sc);
                    ctx.shadowColor = 'rgba(0,0,0,0.35)';
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, PLANE_BODY_RX, PLANE_BODY_RY, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#3b82f6';
                    ctx.beginPath();
                    ctx.moveTo(PLANE_BODY_RX, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.5, -PLANE_BODY_RY * 0.9);
                    ctx.lineTo(PLANE_BODY_RX * 0.5, PLANE_BODY_RY * 0.9);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#93c5fd';
                    ctx.beginPath();
                    ctx.arc(PLANE_BODY_RX * 0.35, 0, PLANE_BODY_RY * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.12, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.15, -PLANE_BODY_RY * 2.2);
                    ctx.lineTo(PLANE_BODY_RX * 0.4, -PLANE_BODY_RY * 2.2);
                    ctx.lineTo(0, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.12, 0);
                    ctx.lineTo(PLANE_BODY_RX * 0.15, PLANE_BODY_RY * 2.2);
                    ctx.lineTo(PLANE_BODY_RX * 0.4, PLANE_BODY_RY * 2.2);
                    ctx.lineTo(0, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.moveTo(-PLANE_BODY_RX * 0.7, 0);
                    ctx.lineTo(-PLANE_BODY_RX * 0.3, -PLANE_BODY_RY * 1.3);
                    ctx.lineTo(-PLANE_BODY_RX * 0.12, -PLANE_BODY_RY * 1.3);
                    ctx.lineTo(-PLANE_BODY_RX * 0.45, 0);
                    ctx.closePath();
                    ctx.fill();
                    const pa = Date.now() / 50;
                    ctx.fillStyle = '#64748b';
                    ctx.save();
                    ctx.translate(PLANE_BODY_RX, 0);
                    ctx.rotate(pa);
                    ctx.fillRect(-1, -PLANE_BODY_RY * 0.85, 2, PLANE_BODY_RY * 1.7);
                    ctx.fillRect(-PLANE_BODY_RY * 0.85, -1, PLANE_BODY_RY * 1.7, 2);
                    ctx.restore();
                    ctx.shadowBlur = 0;
                    ctx.restore();
                }
            }

            function gameLoop() {
                const zd = state.targetZoom - state.viewZoom;
                if (Math.abs(zd) < 0.0005) state.viewZoom = state.targetZoom;
                else state.viewZoom += zd * ZOOM_LERP_SPEED;
                if (state.isResetting) {
                    const dx = state.resetTargetX - state.viewX,
                        dy = state.resetTargetY - state.viewY;
                    if (Math.sqrt(dx * dx + dy * dy) < 3 && Math.abs(state.targetZoom - state.viewZoom) < 0.003) { state
                            .viewX = state.resetTargetX;
                        state.viewY = state.resetTargetY;
                        state.viewZoom = state.targetZoom;
                        state.isResetting = false; } else { state.viewX += dx * RESET_LERP_SPEED;
                        state.viewY += dy * RESET_LERP_SPEED; }
                }
                if (state.isFlying && state.flight) {
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const tt = state.flight.durationMin * 60;
                    updateFlightBarDisplay();
                    if (el / tt >= 1) completeFlight();
                }
                drawMap();
                state.animationId = requestAnimationFrame(gameLoop);
            }

            function updateFlightBarDisplay() {
                if (!state.flight || !state.isFlying) return;
                const el = Math.max(0, (Date.now() - state.flight.startTime) / 1000);
                const tt = state.flight.durationMin * 60;
                const rem = Math.max(0, tt - el);
                flightTimer.textContent = String(Math.floor(rem / 60)).padStart(2, '0') + ':' + String(Math.floor(rem %
                    60)).padStart(2, '0');
                flightDist.textContent = (state.flight.totalDistKm * Math.min(1, el / tt)).toFixed(3) + ' km';
            }

            function handleAirportClick(airport) {
                if (state.isFlying) return;
                const now = Date.now();
                if (now - state.lastAirportClickTime < 300) return;
                state.lastAirportClickTime = now;
                if (!state.departureAirport && !state.destinationAirport) { state.departureAirport = airport;
                    state.destinationAirport = null; } else if (state.departureAirport && !state.destinationAirport) {
                    if (state.departureAirport.id === airport.id) { state.departureAirport = null;
                        updateSelectionHint();
                        shakeSelectionHint(); return; }
                    state.destinationAirport = airport;
                    updateSelectionHint();
                    setTimeout(() => showDurationPanel(), 160);
                    return;
                } else { state.departureAirport = airport;
                    state.destinationAirport = null; }
                updateSelectionHint();
            }

            function updateSelectionHint() {
                if (state.isFlying) { selectionHint.style.opacity = '0'; return; }
                selectionHint.classList.remove('shake');
                if (!state.departureAirport && !state.destinationAirport) { selectionHint.textContent =
                        '👆 点击机场选择起点';
                    selectionHint.style.color = 'var(--text2)'; } else if (state.departureAirport && !state
                    .destinationAirport) { selectionHint.textContent = '👆 点击另一个机场选择终点';
                    selectionHint.style.color = '#22c55e'; } else { selectionHint.textContent = '✅ 起降点已选定';
                    selectionHint.style.color = 'var(--accent)'; }
                selectionHint.style.opacity = '1';
            }

            function shakeSelectionHint() { selectionHint.classList.remove('shake');
                void selectionHint.offsetWidth;
                selectionHint.classList.add('shake');
                selectionHint.style.color = '#ef4444';
                selectionHint.textContent = '⚠️ 起点与终点不能相同';
                setTimeout(updateSelectionHint, 800); }

            function clearAirportSelection() { state.departureAirport = null;
                state.destinationAirport = null;
                updateSelectionHint(); }

            function showDurationPanel() {
                const dep = state.departureAirport,
                    dest = state.destinationAirport;
                if (!dep || !dest || dep.id === dest.id) { clearAirportSelection(); return; }
                const ad = calcDistanceKm(dep, dest);
                state.viewX = (dep.x + dest.x) / 2;
                state.viewY = (dep.y + dest.y) / 2;
                clampViewport();
                const o = document.createElement('div');
                o.className = 'overlay';
                o.innerHTML =
                    '<div class="panel"><h2>✈️ 设定专注时长</h2><p class="subtitle"><span style="color:#22c55e;">' + dep
                    .name + '</span> → <span style="color:#ef4444;">' + dest.name +
                    '</span></p><p class="text-center" style="font-size:13px;color:var(--accent2);margin-bottom:8px;">📍 航线距离：<strong>' +
                    ad.toFixed(1) + ' 公里</strong></p><div class="duration-options">' + [15, 30, 45, 60, 90].map(m =>
                        '<button class="duration-opt' + (m === 30 ? ' selected' : '') + '" data-m="' + m + '">' + m +
                        '分钟</button>').join('') +
                    '</div><p class="text-center" style="font-size:12px;color:var(--text2);margin:8px 0;">飞行速度：<strong id="es">' +
                    (ad / 30).toFixed(1) +
                    ' 公里/分钟</strong></p><button class="btn btn-primary mt-8" id="cfb">确认并生成机票</button><button class="btn btn-ghost mt-8" style="width:100%;" id="cxb">取消选择</button></div>';
                document.body.appendChild(o);
                let sm = 30;
                o.querySelectorAll('.duration-opt').forEach(b => b.addEventListener('click', () => { o.querySelectorAll(
                            '.duration-opt').forEach(bb => bb.classList.remove('selected'));
                    b.classList.add('selected');
                    sm = +b.dataset.m;
                    o.querySelector('#es').textContent = (ad / sm).toFixed(1) + ' 公里/分钟'; }));
                o.querySelector('#cfb').addEventListener('click', () => { o.remove();
                    generateTicket(sm, ad); });
                const cf = () => { o.remove();
                    clearAirportSelection(); };
                o.querySelector('#cxb').addEventListener('click', cf);
                o.addEventListener('click', e => { if (e.target === o) cf(); });
            }

            // ═══════════════════ ★★★★★ 机票：横向撕开效果 ★★★★★ ═══════════════════
            function generateTicket(dm, ad) {
                const from = state.departureAirport,
                    to = state.destinationAirport;
                if (!from || !to || from.id === to.id) { clearAirportSelection(); return; }
                const fn = 'FF' + String(Math.floor(Math.random() * 9000) + 1000);
                const ds = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' +
                    String(new Date().getDate()).padStart(2, '0');

                const overlay = document.createElement('div');
                overlay.id = 'ticketOverlay';
                overlay.innerHTML =
                    '<div class="ticket-card" id="ticketCard">' +
                    '<div class="ticket-top">' +
                    '<div class="ticket-header"><div class="flight-no">' + fn +
                    '</div><div style="font-size:10px;color:var(--text2);">专注飞行 · 电子机票</div></div>' +
                    '<div class="ticket-route">' + from.name + ' <span class="arrow">✈️ ➤</span> ' + to.name +
                    '</div>' +
                    '<div class="ticket-info">日期 <span>' + ds + '</span> &nbsp;·&nbsp; 专注 <span>' + dm +
                    '分钟</span><br>里程 <span>' + ad.toFixed(1) + ' km</span> &nbsp;·&nbsp; 航班 <span>' + fn +
                    '</span></div>' +
                    '</div>' +
                    '<div class="ticket-dashed-sep"></div>' +
                    '<div class="ticket-tear-strip" id="tearStrip">' +
                    '<div class="tear-hint-text">👆 从左向右滑动撕开</div>' +
                    '<span class="tear-swipe-arrow">➡️</span>' +
                    '<div class="tear-progress-indicator" id="tearProgress"></div>' +
                    '</div>' +
                    '</div>';
                document.body.appendChild(overlay);

                const strip = overlay.querySelector('#tearStrip');
                const card = overlay.querySelector('#ticketCard');
                const progressBar = overlay.querySelector('#tearProgress');
                let dragActive = false;
                let startX = 0,
                    startY = 0;
                let progress = 0;
                let torn = false;
                let horizontalConfirmed = false;

                function onStart(e) {
                    if (torn) return;
                    dragActive = true;
                    horizontalConfirmed = false;
                    startX = e.touches ? e.touches[0].clientX : e.clientX;
                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                    progress = 0;
                    strip.style.transition = 'none';
                    progressBar.style.transition = 'none';
                    strip.style.transform = '';
                    strip.style.background = '';
                    progressBar.style.width = '0%';
                }

                function onMove(e) {
                    if (!dragActive || torn) return;
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const cy = e.touches ? e.touches[0].clientY : e.clientY;
                    const dx = cx - startX;
                    const dy = cy - startY;

                    // ★ 仅响应水平滑动：|dx| > 10 且 |dx| > |dy|
                    if (!horizontalConfirmed) {
                        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
                            horizontalConfirmed = true;
                        } else if (Math.abs(dy) > 15 && Math.abs(dy) > Math.abs(dx)) {
                            // 明显垂直移动 → 取消撕票，回弹
                            dragActive = false;
                            strip.style.transition =
                                'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                            strip.style.transform = '';
                            strip.style.background = '';
                            progressBar.style.transition = 'width 0.3s ease';
                            progressBar.style.width = '0%';
                            return;
                        } else {
                            return; // 还没确认方向
                        }
                    }

                    const cardWidth = card.getBoundingClientRect().width;
                    progress = Math.max(0, Math.min(1, dx / (cardWidth * 0.9)));

                    // ★ 折叠效果：下半部分从顶部边缘向下折叠
                    const angle = progress * 60; // 最大60度
                    strip.style.transform = 'perspective(500px) rotateX(' + angle + 'deg)';
                    strip.style.transformOrigin = 'top center';

                    // 进度条
                    progressBar.style.width = (progress * 100) + '%';

                    // 接近完成时变红提示
                    if (progress > 0.7) {
                        strip.style.background = 'rgba(239,68,68,0.13)';
                    } else {
                        strip.style.background = '';
                    }
                }

                function onEnd() {
                    if (!dragActive || torn) return;
                    dragActive = false;
                    strip.style.background = '';

                    if (horizontalConfirmed && progress >= TEAR_PROGRESS_THRESHOLD) {
                        // ★ 撕开完成：下半部分向下掉落消失
                        torn = true;
                        strip.style.transition =
                            'transform 0.7s cubic-bezier(0.55, 0, 0.45, 1), opacity 0.5s ease 0.3s';
                        strip.style.transform = 'perspective(500px) rotateX(80deg) translateY(80px)';
                        strip.style.opacity = '0';
                        strip.style.pointerEvents = 'none';
                        progressBar.style.transition = 'width 0.3s ease';
                        progressBar.style.width = '100%';
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                        setTimeout(() => {
                            if (overlay.parentNode) overlay.remove();
                            beginFlight(dm, ad, fn);
                        }, 800);
                    } else {
                        // ★ 回弹
                        strip.style.transition =
                            'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                        strip.style.transform = '';
                        progressBar.style.transition = 'width 0.35s ease';
                        progressBar.style.width = '0%';
                        progress = 0;
                    }
                }

                // 触摸事件绑定在撕票区域上
                strip.addEventListener('touchstart', onStart, { passive: true });
                strip.addEventListener('touchmove', onMove, { passive: true });
                strip.addEventListener('touchend', onEnd);
                strip.addEventListener('touchcancel', onEnd);

                // 鼠标事件（桌面调试）
                strip.addEventListener('mousedown', onStart);
                window.addEventListener('mousemove', function(e) { if (dragActive) onMove(e); });
                window.addEventListener('mouseup', function() { if (dragActive) onEnd(); });

                // 点击遮罩关闭
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay && !torn && progress < 0.1) {
                        overlay.remove();
                        clearAirportSelection();
                    }
                });
            }

            // ═══════════════════ 飞行控制 ═══════════════════
            function beginFlight(dm, td, fn) {
                const f = state.departureAirport,
                    t = state.destinationAirport;
                if (!f || !t) return;
                state.flight = { from: f, to: t, durationMin: dm, totalDistKm: td, flightNo: fn, startTime: Date.now() };
                state.isFlying = true;
                state.departureAirport = null;
                state.destinationAirport = null;
                state.isResetting = false;
                flightBar.classList.remove('hidden');
                selectionHint.style.opacity = '0';
                updateFlightBarDisplay();
                requestWakeLock();
                window._fa = true;
            }

            function completeFlight() {
                const fl = state.flight;
                if (!fl) return;
                state.history.unshift({ fromName: fl.from.name, toName: fl.to.name, durationMin: fl.durationMin,
                    km: fl.totalDistKm, flightNo: fl.flightNo, date: new Date().toISOString() });
                state.totalKm += fl.totalDistKm;
                saveData();
                state.flight = null;
                state.isFlying = false;
                flightBar.classList.add('hidden');
                window._fa = false;
                releaseWakeLock();
                updateSelectionHint();
                showCelebration(fl.totalDistKm);
                checkAchievements();
            }

            function cancelFlight() {
                const o = document.createElement('div');
                o.className = 'overlay';
                o.innerHTML =
                    '<div class="panel"><h2>⚠️ 确认取消</h2><p class="subtitle">强制取消将不计入飞行记录和里程</p><button class="btn btn-danger mt-8" style="width:100%;" id="ccb">确定取消</button><button class="btn btn-ghost mt-8" style="width:100%;" id="kfb">继续飞行</button></div>';
                document.body.appendChild(o);
                o.querySelector('#ccb').addEventListener('click', () => { o.remove();
                    state.isFlying = false;
                    state.flight = null;
                    state.departureAirport = null;
                    state.destinationAirport = null;
                    flightBar.classList.add('hidden');
                    window._fa = false;
                    releaseWakeLock();
                    updateSelectionHint(); });
                o.querySelector('#kfb').addEventListener('click', () => o.remove());
                o.addEventListener('click', e => { if (e.target === o) o.remove(); });
            }

            function resetView() {
                state.isResetting = true;
                if (state.isFlying && state.flight) {
                    const el = (Date.now() - state.flight.startTime) / 1000;
                    const prog = Math.min(1, Math.max(0, el / (state.flight.durationMin * 60)));
                    state.resetTargetX = state.flight.from.x + (state.flight.to.x - state.flight.from.x) * prog;
                    state.resetTargetY = state.flight.from.y + (state.flight.to.y - state.flight.from.y) * prog;
                } else { state.resetTargetX = MAP_W / 2;
                    state.resetTargetY = MAP_H / 2; }
                state.targetZoom = state.defaultZoom;
            }

            function showCelebration(km) {
                for (let i = 0; i < 45; i++) {
                    const el = document.createElement('span');
                    el.className = 'confetti';
                    el.textContent = ['🌟', '✨', '🎉', '🎊', '💫', '⭐', '🌸', '🎯', '💎', '🦋'][Math.floor(Math.random() *
                        10)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.top = -(Math.random() * 120 + 20) + 'px';
                    el.style.animationDuration = (Math.random() * 2.8 + 2.2) + 's';
                    el.style.animationDelay = Math.random() * 0.8 + 's';
                    el.style.fontSize = (Math.random() * 24 + 18) + 'px';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 3600);
                }
                if (navigator.vibrate) navigator.vibrate([50, 80, 50, 80, 100]);
                const t = document.createElement('div');
                t.style.cssText =
                    'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;background:var(--acrylic);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:26px 34px;text-align:center;border:1px solid var(--border2);animation:popIn 0.4s ease;box-shadow:0 16px 48px rgba(0,0,0,0.55);';
                t.innerHTML =
                    '<div style="font-size:50px;">🛬</div><div style="font-size:21px;font-weight:700;color:#fff;margin-top:8px;">抵达目的地！</div><div style="font-size:14px;color:var(--accent2);margin-top:4px;">本次飞行 ' +
                    km.toFixed(1) + ' 公里</div>';
                document.body.appendChild(t);
                setTimeout(() => { t.style.opacity = '0';
                    t.style.transition = 'opacity 0.5s'; }, 2000);
                setTimeout(() => t.remove(), 2600);
            }

            function checkAchievements() {
                for (const a of ACHIEVEMENTS) { if (state.totalKm >= a.threshold && !state.unlockedAchievements.includes(
                        a.name)) { state.unlockedAchievements.push(a.name);
                        saveData();
                        showAchievementPopup(a); } }
            }

            function showAchievementPopup(a) {
                const o = document.createElement('div');
                o.className = 'overlay';
                o.style.zIndex = '85';
                o.innerHTML = '<div class="achievement-card"><div class="icon">' + a.icon + '</div><div class="name">' + a
                    .name + '</div><div class="desc">' + a.desc +
                    '</div><p style="font-size:28px;margin-top:4px;">🏆</p></div>';
                document.body.appendChild(o);
                if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 80]);
                o.addEventListener('click', () => o.remove());
                setTimeout(() => { if (o.parentNode) o.remove(); }, 3500);
            }

            function renderAchievements() {
                achievementsList.innerHTML = '';
                for (const a of ACHIEVEMENTS) {
                    const ul = state.unlockedAchievements.includes(a.name);
                    const d = document.createElement('div');
                    d.className = 'achievement-item ' + (ul ? 'unlocked' : 'locked');
                    d.innerHTML = '<span class="ach-icon">' + (ul ? a.icon : '🔒') +
                        '</span><div class="ach-info"><div class="ach-name" style="font-size:14px;font-weight:700;color:#fff;">' +
                        a.name + '</div><div class="ach-req" style="font-size:11px;color:var(--text2);">' + a.desc +
                        '</div></div>' + (ul ? '<span style="color:var(--gold);font-size:18px;">✅</span>' : '');
                    achievementsList.appendChild(d);
                }
                totalKmDisplay.textContent = Math.floor(state.totalKm);
            }

            function renderRecords() {
                recordsList.innerHTML = '';
                if (!state.history.length) { recordsList.innerHTML =
                        '<p class="text-center" style="color:var(--text2);padding:40px 0;">暂无飞行记录<br>去地图上选机场开始吧 ✈️</p>'; return; }
                for (const r of state.history) {
                    const d = new Date(r.date);
                    const ds = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
                    const div = document.createElement('div');
                    div.className = 'record-item';
                    div.innerHTML = '<div style="min-width:0;flex:1;"><div class="route">' + r.fromName + ' → ' + r
                        .toName + '</div><div class="meta">' + ds + ' · ' + r.durationMin + '分钟 · ' + r.flightNo +
                        '</div></div><span class="km">' + r.km.toFixed(1) + ' km</span>';
                    recordsList.appendChild(div);
                }
            }

            function exportData() {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([JSON.stringify({ totalKm: state.totalKm, history: state.history,
                    unlockedAchievements: state.unlockedAchievements, exportedAt: new Date().toISOString() },
                    null, 2)], { type: 'application/json' }));
                a.download = 'focus-flight-data.json';
                a.click();
                URL.revokeObjectURL(a.href);
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.history || !Array.isArray(data.history)) throw new Error('无效');
                        state.totalKm = Math.max(state.totalKm, data.totalKm || 0);
                        if (data.unlockedAchievements)
                            for (const a of data.unlockedAchievements)
                                if (!state.unlockedAchievements.includes(a)) state.unlockedAchievements.push(a);
                        const ek = new Set(state.history.map(h => (h.date || '') + '_' + (h.flightNo || '')));
                        if (data.history)
                            for (const h of data.history) { const k = (h.date || '') + '_' + (h.flightNo || ''); if (!ek
                                    .has(k)) { state.history.push(h);
                                    ek.add(k); } }
                        state.history.sort((a, b) => new Date(b.date) - new Date(a.date));
                        saveData();
                        renderRecords();
                        renderAchievements();
                        alert('导入成功！');
                    } catch (err) { alert('导入失败：格式不正确'); }
                };
                reader.readAsText(file);
            }

            async function requestWakeLock() {
                try { if ('wakeLock' in navigator) { state.wakeLock = await navigator.wakeLock.request('screen');
                        state.wakeLock.addEventListener('release', () => {}); } } catch (e) {}
            }
            async function releaseWakeLock() { if (state.wakeLock) { try { await state.wakeLock.release(); } catch (
                e) {} state.wakeLock = null; } }

            // ═══════════════════ Canvas 事件 ═══════════════════
            function getTD(t) { return Math.sqrt((t[0].clientX - t[1].clientX) ** 2 + (t[0].clientY - t[1].clientY) ** 2); }

            function getTC(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }

            function getCP(e) {
                const r = canvas.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: cx - r.left, y: cy - r.top };
            }

            function hPD(e) {
                e.preventDefault();
                const t = e.touches;
                if (!t || !t.length) return;
                if (t.length === 2) { state.isPinching = true;
                    state.panStart = null;
                    state.pendingClickAirport = null;
                    state.pinchStartDist = getTD(t);
                    state.pinchStartZoom = state.viewZoom; const c = getTC(t);
                    state.pinchCenterX = c.x;
                    state.pinchCenterY = c.y; return; }
                state.isPinching = false;
                const p = getCP(e);
                state.pointerDownPos = p;
                state.pointerMoved = false;
                const hit = hitTestAirport(p.x, p.y);
                if (hit && !state.isFlying) { state.pendingClickAirport = hit;
                    state.panStart = null; } else { state.pendingClickAirport = null;
                    state.panStart = { x: p.x, y: p.y, vx: state.viewX, vy: state.viewY }; }
            }

            function hPM(e) {
                e.preventDefault();
                const t = e.touches;
                if (!t || !t.length) return;
                if (t.length === 2 && state.isPinching) {
                    const nd = getTD(t);
                    state.viewZoom = clampZoom(state.pinchStartZoom * (nd / Math.max(state.pinchStartDist, 1)));
                    state.targetZoom = state.viewZoom;
                    const c = getTC(t);
                    state.viewX -= (c.x - state.pinchCenterX) / state.viewZoom;
                    state.viewY -= (c.y - state.pinchCenterY) / state.viewZoom;
                    state.pinchCenterX = c.x;
                    state.pinchCenterY = c.y;
                    clampViewport();
                    state.panStart = null;
                    state.pendingClickAirport = null;
                    state.pointerMoved = true;
                    return;
                }
                if (t.length === 1 && !state.isPinching) {
                    const p = getCP(e);
                    if (Math.abs(p.x - state.pointerDownPos.x) > CLICK_MOVE_THRESHOLD || Math.abs(p.y - state
                            .pointerDownPos.y) > CLICK_MOVE_THRESHOLD) { state.pointerMoved = true;
                        state.pendingClickAirport = null; }
                    if (state.panStart) { state.viewX = state.panStart.vx - (p.x - state.panStart.x) / state.viewZoom;
                        state.viewY = state.panStart.vy - (p.y - state.panStart.y) / state.viewZoom;
                        clampViewport(); }
                    if (!state.isFlying && !state.panStart) {
                        const hit = hitTestAirport(p.x, p.y);
                        if (hit !== state.tooltipAirport) { state.tooltipAirport = hit; if (hit) {
                                airportTooltip.textContent = hit.name;
                                const cr = canvas.getBoundingClientRect();
                                airportTooltip.style.left = (cr.left + p.x + 16) + 'px';
                                airportTooltip.style.top = (cr.top + p.y - 30) + 'px';
                                airportTooltip.classList.add('visible'); } else airportTooltip.classList.remove(
                                'visible'); }
                    }
                }
            }

            function hPU(e) {
                const t = e.touches;
                if ((!t || t.length < 2) && state.isPinching) { state.isPinching = false;
                    state.targetZoom = state.viewZoom; }
                if (!state.isFlying && !state.isPinching && !state.pointerMoved && state.pendingClickAirport)
                    handleAirportClick(state.pendingClickAirport);
                state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false;
            }
            canvas.addEventListener('touchstart', hPD, { passive: false });
            canvas.addEventListener('touchmove', hPM, { passive: false });
            canvas.addEventListener('touchend', hPU);
            canvas.addEventListener('touchcancel', hPU);
            canvas.addEventListener('mousedown', e => {
                const p = getCP(e);
                state.pointerDownPos = p;
                state.pointerMoved = false;
                const hit = hitTestAirport(p.x, p.y);
                if (hit && !state.isFlying) { state.pendingClickAirport = hit;
                    state.panStart = null; } else { state.pendingClickAirport = null;
                    state.panStart = { x: p.x, y: p.y, vx: state.viewX, vy: state.viewY }; }
            });
            canvas.addEventListener('mousemove', e => {
                if (state.panStart) {
                    const p = getCP(e);
                    if (Math.abs(p.x - state.pointerDownPos.x) > CLICK_MOVE_THRESHOLD || Math.abs(p.y - state
                            .pointerDownPos.y) > CLICK_MOVE_THRESHOLD) { state.pointerMoved = true;
                        state.pendingClickAirport = null; }
                    state.viewX = state.panStart.vx - (p.x - state.panStart.x) / state.viewZoom;
                    state.viewY = state.panStart.vy - (p.y - state.panStart.y) / state.viewZoom;
                    clampViewport();
                }
            });
            canvas.addEventListener('mouseup', () => {
                if (!state.isFlying && !state.pointerMoved && state.pendingClickAirport) handleAirportClick(state
                    .pendingClickAirport);
                state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false;
            });
            canvas.addEventListener('mouseleave', () => { state.panStart = null;
                state.pendingClickAirport = null;
                state.pointerMoved = false; });
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const p = getCP(e);
                const wb = screenToWorld(p.x, p.y);
                state.viewZoom = clampZoom(state.viewZoom * (e.deltaY > 0 ? 0.87 : 1.13));
                state.targetZoom = state.viewZoom;
                const wa = screenToWorld(p.x, p.y);
                state.viewX += wb.x - wa.x;
                state.viewY += wb.y - wa.y;
                clampViewport();
            }, { passive: false });

            cancelFlightBtn.addEventListener('click', cancelFlight);
            resetViewBtn.addEventListener('click', resetView);

            function switchView(v) {
                state.currentView = v;
                navButtons.forEach(b => b.classList.toggle('active', b.dataset.view === v));
                const im = v === 'map';
                selectionHint.style.display = im ? '' : 'none';
                recordsPage.classList.toggle('active', v === 'records');
                achievementsPage.classList.toggle('active', v === 'achievements');
                if (v === 'records') renderRecords();
                if (v === 'achievements') renderAchievements();
                if (v === 'map') updateSelectionHint();
            }
            navButtons.forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]);
                importFileInput.value = ''; });
            window.addEventListener('beforeunload', e => { if (window._fa) { e.preventDefault();
                    e.returnValue = '飞行正在进行中，确定离开吗？'; return e.returnValue; } });
            document.addEventListener('visibilitychange', () => { if (document.hidden && state.isFlying) releaseWakeLock();
                else if (!document.hidden && state.isFlying) requestWakeLock(); });
            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('gesturechange', e => e.preventDefault());
            document.addEventListener('gestureend', e => e.preventDefault());

            function setupPWA() {
                const m = { name: '专注飞行', short_name: '专注飞行', description: '在专注中飞向远方',
                    start_url: location.href, display: 'standalone', orientation: 'portrait',
                    background_color: '#070b14', theme_color: '#070b14', icons: [{ src: 'data:image/svg+xml,' +
                            encodeURIComponent(
                                '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="32" fill="#070b14"/><text x="96" y="115" text-anchor="middle" font-size="80">✈️</text></svg>'
                                ), sizes: '192x192', type: 'image/svg+xml' }] };
                const l = document.createElement('link');
                l.rel = 'manifest';
                l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/json' }));
                document.head.appendChild(l);
                if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([
                    "const C='ff-v12';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['" +
                    location.href + "'])).catch(()=>{}))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(r2=>{if(r2.ok){caches.open(C).then(c=>c.put(e.request,r2.clone()));}return r2;})))});"
                ], { type: 'application/javascript' }))).catch(() => {});
            }

            function init() {
                loadData();
                generateTerrainAndRivers();
                placeAirports();
                resizeCanvas();
                state.viewX = MAP_W / 2;
                state.viewY = MAP_H / 2;
                state.viewZoom = state.defaultZoom;
                state.targetZoom = state.defaultZoom;
                switchView('map');
                gameLoop();
                setupPWA();
                window.addEventListener('resize', () => { resizeCanvas();
                    clampViewport(); });
            }
            init();
            console.log('🛩️ 专注飞行 v12 | 地图:' + MAP_W + '×' + MAP_H + ' | 机场:' + state.airports.length +
                ' | 里程:' + Math.floor(state.totalKm) + 'km');
        })();
    </script>
</body>
</html>
